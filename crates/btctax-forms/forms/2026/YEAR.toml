# ★ Form 1099-DA regime (spec 1099-DA): brokers report PROCEEDS from TY2025 and BASIS on covered
#   digital assets acquired on/after 2026-01-01 (Treas. Reg. §1.6045-1(a)(15)(i)(J)). This is the year
#   the broker-reporting question goes LIVE (liveness = basis AND ≥1 exchange disposition).
[information_returns.f1099da]
proceeds = true
basis    = true
