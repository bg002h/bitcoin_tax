# Schedule 1 (Additional Income and Adjustments to Income), Form 1040, TY2024.
#
# Extracted with `xtask dump-fields` + correlated against the printed form (`pdftotext -layout`).
#
# ⚠️ ROOT SUBFORM IS `form1[0]` (as on Schedule 2) — NOT the `topmostSubform[0]` used by Schedule 3,
# the 1040, Schedule A and everything else. Do not "unify" it.
#
# ⚠️ TWO PAGES — descent is grouped BY PAGE (Part II is entirely on page 2).
#
# Column x-clusters (code-side oracle in schedule1.rs): MID x ≈ [410,482], AMOUNT x ≈ [504,576].
#
# ★ LINE 22 (`f2_14`) IS A ReadOnly "Reserved for future use" WIDGET — live, and it CONSUMES a suffix
#   number (f2_13 = line 21, f2_14 = line 22 reserved, f2_15 = line 23). Anything that walks suffixes
#   and "skips reserved lines" misaligns line 23 onward by one. Never write it.
#
# ★ NON-MONEY FIELDS SIT IN THE MONEY x-BAND — writing a dollar amount into one prints garbage:
#     f1_06                     line 2b — a DATE (divorce/separation agreement)
#     Line19b_CombField.f2_10   line 19b — the recipient's SSN, a COMB field
#     f2_11                     line 19c — a DATE
#
# ★ PARENTHESIZED `( )` BOXES (positive magnitudes only): lines 8a (f1_12), 8d (f1_15), 8s (f1_30).
#   v1 fills none of them, but the sign convention is recorded — the parentheses ARE the minus sign.
#
# UNMAPPED ON PURPOSE — BLANK, never a misleading 0:
#   Part I:  2a/2b (alimony), 4 (Form 4797), 5 (Schedule E — UNREPRESENTABLE in v1), 6 (Schedule F),
#            8a-8u and 8w-8z (every other write-in)
#   Part II: 11-14, 16, 17, 19a-19c, 20, 22 (reserved), 23, 24a-24z, 25
form = "f1040s1"
year = 2024

# ── Part I — Additional Income (page 1) ─────────────────────────────────────────────────────────
line1  = "form1[0].Page1[0].f1_04[0]"   # "Taxable refunds, credits, or offsets of state and local income taxes"  AMOUNT
line3  = "form1[0].Page1[0].f1_07[0]"   # "Business income or (loss). Attach Schedule C"                          AMOUNT
line7  = "form1[0].Page1[0].f1_11[0]"   # "Unemployment compensation"                                            AMOUNT
line8v = "form1[0].Page1[0].f1_33[0]"   # "Digital assets received as ordinary income not reported elsewhere"    MID   ★ btctax
line9  = "form1[0].Page1[0].f1_37[0]"   # "Total other income. Add lines 8a through 8z"                          AMOUNT
line10 = "form1[0].Page1[0].f1_38[0]"   # "Combine lines 1 through 7 and 9…" → 1040 line 8                       AMOUNT

# ── Part II — Adjustments to Income (page 2) ────────────────────────────────────────────────────
line15 = "form1[0].Page2[0].f2_05[0]"   # "Deductible part of self-employment tax. Attach Schedule SE"           AMOUNT
line18 = "form1[0].Page2[0].f2_08[0]"   # "Penalty on early withdrawal of savings"                               AMOUNT
line21 = "form1[0].Page2[0].f2_13[0]"   # "Student loan interest deduction"                                      AMOUNT
line26 = "form1[0].Page2[0].f2_31[0]"   # "Add lines 11 through 23 and 25…" → 1040 line 10                       AMOUNT

# ── Identity header (P6.2). Dumped + correlated against the printed form; the SSN cell declares
#    /MaxLen 11, so it takes the HYPHENATED form (the 1040's own SSN cells are /MaxLen 9 and take
#    bare digits — the forms genuinely differ, so `push_identity` reads each cell's capacity).
[identity]
name = "form1[0].Page1[0].f1_01[0]"
ssn  = "form1[0].Page1[0].f1_02[0]"

# ── §G-13 FIELD-PROVENANCE CENSUS ────────────────────────────────────────────────────────────────
# Every AcroForm field on this PDF the map above does not fill, with the decision that leaves it blank.
# `unmodeled` = btctax models no input that could reach the line; `artifact` = not an entry the filer
# makes; `gap` = the line IS reachable and nothing populates it (a defect).
#
# ★★ DIRECTION — this form has BOTH halves, so the split matters more here than anywhere else:
#      Part I (lines 1-10) is ADDITIONAL INCOME — a wrongly-blank line UNDERSTATES.
#      Part II (lines 11-26) is ADJUSTMENTS — a blank only ever OVERSTATES (a forgone deduction).
#    Every Part I line below is income btctax cannot see at all; the two whose absence is enforced
#    rather than merely unmodelled (8a and 8p) are named where they occur.
#
# ★ Line 8v, "Digital assets received as ordinary income not reported elsewhere", is btctax's OWN
#   line and is mapped above. This census covers the 21 siblings it does not fill.
#
# ★ Parenthesized (NEGATIVE-magnitude) lines print in an inset, narrower cell — 8a, 8d and 8s sit at
#   x=[414.4,478.4] where the rest of the line-8 column is x=[410.4,481.6]. Same signature as
#   Schedule D lines 6/14 and line 21.
[census]

# ── The unnumbered 1099-K reconciliation line, above Part I ──────────────────────────────────────
# "For 2024, enter the amount reported to you on Form(s) 1099-K that was included in error or for
# personal items sold at a loss." ★ Adjacent to btctax's domain — digital-asset exchanges do issue
# 1099-Ks — but it is a RECONCILIATION line that feeds no sum, and it reports amounts to be BACKED
# OUT, so leaving it blank can only overstate income. btctax collects no 1099-K.
"form1[0].Page1[0].f1_03[0]" = { line = "1099-K", rule = "unmodeled", reason = "Amount from Form(s) 1099-K included in error or for personal items sold at a loss — btctax collects no 1099-K. Informational: it feeds no sum, and it reduces rather than adds." }

# ── Part I lines 2a-6: additional income from schedules btctax does not emit ─────────────────────
"form1[0].Page1[0].f1_05[0]" = { line = "2a", rule = "unmodeled", reason = "Alimony received — btctax models no alimony." }
"form1[0].Page1[0].f1_06[0]" = { line = "2b", rule = "unmodeled", reason = "Date of the original divorce or separation agreement — dead with line 2a blank (the date only matters to decide pre/post-TCJA treatment of an amount)." }
"form1[0].Page1[0].f1_08[0]" = { line = "4",  rule = "unmodeled", reason = "Other gains or (losses), Form 4797 — no §1231 property modelled (matching Schedule D line 11)." }
"form1[0].Page1[0].f1_09[0]" = { line = "5",  rule = "unmodeled", reason = "Rental real estate, royalties, partnerships, S corporations, trusts (Schedule E) — btctax models no pass-through entities or rental property (matching Form 8960 line 4a)." }
"form1[0].Page1[0].f1_10[0]" = { line = "6",  rule = "unmodeled", reason = "Farm income or (loss), Schedule F — not modelled." }

# ── Part I line 8: the other-income menu ─────────────────────────────────────────────────────────
"form1[0].Page1[0].Line8a_ReadOrder[0].f1_12[0]" = { line = "8a", rule = "unmodeled", reason = "Net operating loss ★ PAREN — btctax models no NOL (already recorded as uncaptured at btctax-core/src/tax/amt.rs:40). A negative line, so forgoing it overstates." }
"form1[0].Page1[0].f1_13[0]" = { line = "8b", rule = "unmodeled", reason = "Gambling income — not modelled (broken out onto its own line for 2024; previously an 8z write-in)." }
"form1[0].Page1[0].f1_14[0]" = { line = "8c", rule = "unmodeled", reason = "Cancellation of debt — btctax collects no Form 1099-C. Income, so the understatement direction; there is no input that could reach it." }
"form1[0].Page1[0].f1_15[0]" = { line = "8d", rule = "unmodeled", reason = "Foreign earned income exclusion from Form 2555 ★ PAREN — btctax models a domestic filer and emits no Form 2555 (see also line 24j)." }
"form1[0].Page1[0].f1_16[0]" = { line = "8e", rule = "unmodeled", reason = "Income from Form 8853 (Archer MSA / long-term care) — no MSA modelled." }
"form1[0].Page1[0].f1_17[0]" = { line = "8f", rule = "unmodeled", reason = "Income from Form 8889 (HSA) — no HSA modelled (matching Schedule 2 lines 17c/17d)." }
"form1[0].Page1[0].f1_18[0]" = { line = "8g", rule = "unmodeled", reason = "Alaska Permanent Fund dividends — not modelled." }
"form1[0].Page1[0].f1_19[0]" = { line = "8h", rule = "unmodeled", reason = "Jury duty pay — not modelled (its offsetting adjustment is line 24a)." }
"form1[0].Page1[0].f1_20[0]" = { line = "8i", rule = "unmodeled", reason = "Prizes and awards — not modelled." }
"form1[0].Page1[0].f1_21[0]" = { line = "8j", rule = "unmodeled", reason = "Activity not engaged in for profit income (§183 hobby income) — btctax's only business path is Schedule C, which is by definition for-profit." }
"form1[0].Page1[0].f1_22[0]" = { line = "8k", rule = "unmodeled", reason = "Stock options — not modelled. ★ Note this is the ORDINARY-income side of a nonqualified option; the AMT side (an ISO exercise, Form 6251 line 2i) is a separate known exposure tracked in the AMT work." }
"form1[0].Page1[0].f1_23[0]" = { line = "8l", rule = "unmodeled", reason = "Income from the rental of personal property engaged in for profit but not as a business — not modelled (its adjustment is line 24b)." }
"form1[0].Page1[0].f1_24[0]" = { line = "8m", rule = "unmodeled", reason = "Olympic and Paralympic medals and USOC prize money — not modelled (its adjustment is line 24c)." }
"form1[0].Page1[0].f1_25[0]" = { line = "8n", rule = "unmodeled", reason = "Section 951(a) inclusion (subpart F) — btctax models no CFC, matching Form 8960's §1.1411-10(g) election census entry." }
"form1[0].Page1[0].f1_26[0]" = { line = "8o", rule = "unmodeled", reason = "Section 951A(a) inclusion (GILTI) — same." }
"form1[0].Page1[0].f1_27[0]" = { line = "8p", rule = "unmodeled", reason = "Section 461(l) excess business loss adjustment. ★ FAIL-CLOSED, not merely unmodelled: a Schedule C net loss REFUSES the return (RefuseReason::ScheduleCLoss, noted at qbi.rs:63), so btctax can never produce the business loss whose excess this line adds back. An add-back is the understatement direction, which is why the refusal matters." }
"form1[0].Page1[0].f1_28[0]" = { line = "8q", rule = "unmodeled", reason = "Taxable distributions from an ABLE account — not modelled." }
"form1[0].Page1[0].f1_29[0]" = { line = "8r", rule = "unmodeled", reason = "Scholarship and fellowship grants not reported on Form W-2 — not modelled." }
"form1[0].Page1[0].f1_30[0]" = { line = "8s", rule = "unmodeled", reason = "Nontaxable Medicaid waiver payments included on Form 1040 line 1a or 1d ★ PAREN — the pairing for 1040 line 1d, which is likewise unmodelled; a negative line, so forgoing it overstates." }
"form1[0].Page1[0].f1_31[0]" = { line = "8t", rule = "unmodeled", reason = "Pension or annuity from a nonqualified deferred compensation plan or a nongovernmental §457 plan — not modelled (matching Schedule 2 lines 17h/17i)." }
"form1[0].Page1[0].f1_32[0]" = { line = "8u", rule = "unmodeled", reason = "Wages earned while incarcerated — not modelled." }
"form1[0].Page1[0].Line8z_ReadOrder[0].f1_34[0]" = { line = "8z type",   rule = "unmodeled", reason = "\"Other income. List type and amount\" free-text — btctax asserts no unnamed income, the same posture as Schedule 3's 6z/13z and Schedule 2's 1y/17z." }
"form1[0].Page1[0].Line8z_ReadOrder[0].f1_35[0]" = { line = "8z type",   rule = "unmodeled", reason = "Second (wider) description cell for the same 8z write-in — same." }
"form1[0].Page1[0].f1_36[0]"                     = { line = "8z amount", rule = "unmodeled", reason = "Amount for the 8z write-in — same." }

