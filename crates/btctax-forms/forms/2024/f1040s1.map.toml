"form1[0].Page2[0].f2_09[0]" = { line = "19a", rule = "unmodeled", reason = "Alimony paid — btctax models no alimony (the receiving side is line 2a)." }
"form1[0].Page2[0].Line19b_CombField[0].f2_10[0]" = { line = "19b", rule = "unmodeled", reason = "Recipient's SSN (/MaxLen 9, a comb) — dead with line 19a blank, and btctax collects no third party's SSN." }
