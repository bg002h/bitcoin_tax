# ── Header ───────────────────────────────────────────────────────────────────────────────────────
#
# ★ LAST on purpose. TOML binds every bare key after a table header INTO that table, so an `[identity]`
#   block above the `lineNN` keys silently swallows all FORTY-ONE of them and the parse then fails with
#   "missing field `line1`", which reads like a typo and is really a layout error.
[identity]
name = "topmostSubform[0].Page1[0].f1_1[0]"
ssn  = "topmostSubform[0].Page1[0].f1_2[0]"

# ── The census: all 61 AcroForm fields are accounted for (2 identity + 41 mapped + 18 here) ──────
#
# ★★★ Lines 2c-2t are Part I add-backs `crates/btctax-core/src/tax/form6251.rs` does not model. They
# are `gap`, NOT `unmodeled`: `unmodeled` means the filer FORGOES A BENEFIT, and every one of these is
# an ADD-BACK — the filer forgoes a LIABILITY. A filer who has one and files anyway understates tax on
# a return signed under 26 USC §6065.
#
# ★★ They are reachable only through a REFUSAL, not through a blank: the §G-22 out-of-scope
# declaration was widened on 2026-08-03 to name limb (b) "you EXERCISED AN INCENTIVE STOCK OPTION and
# still held the stock at the end of the year" and limb (c) the other AMT items, and a `yes` refuses.
# That was necessary because an ISO exercise is NOT INCOME for the regular tax (i6251 line 2i's own
# first sentence), so the income half of that question could never have caught it — and because the
# missing add-back also suppressed `must_attach()`, the gap hid its own detection. See FOLLOWUPS §G-6.

[census]
"topmostSubform[0].Page1[0].f1_6[0]" = { line = "2c", rule = "gap", reason = "A Part I add-back `form6251.rs` does not model. It is an ADD-BACK, so silence UNDERSTATES tax — the filer is REFUSED through the §G-22 out-of-scope declaration (limb (c) names the AMT items) rather than filed with a laundered zero." }
