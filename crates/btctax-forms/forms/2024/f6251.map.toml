line1 = "topmostSubform[0].Page1[0].f1_3[0]"
# 2a "If filing Schedule A (Form 1040), enter the taxes from Schedule A, line 7; otherwise, enter the amount from Form 1040 or 1040-SR, line 12"
line2a = "topmostSubform[0].Page1[0].f1_4[0]"
# 2b "Tax refund from Schedule 1 (Form 1040), line 1 or line 8z"  — PARENTHESISED: write the MAGNITUDE
line2b = "topmostSubform[0].Page1[0].f1_5[0]"
