# Form 6251 (Alternative Minimum Tax—Individuals), TY2024 — logical line → PDF field name.
#
# Extracted with `cargo run -p xtask -- dump-fields crates/btctax-forms/forms/2024/f6251.pdf`
# (61 AcroForm fields: 2 identity + 59 numbered money boxes) and correlated against
# `design/forms/extract/f6251--2024.txt`.
#
# ★★★ THE PAGE-1 FIELD NAMES ARE NOT A UNIFORM OFFSET, and assuming one is the obvious way to get this
# form wrong. `f1_3` is line 1, then `f1_4`..`f1_23` are the TWENTY sub-lines 2a..2t, then `f1_24` is
# line 3. Copying the `f1_N = line N−2` shape another form uses puts every line from 3 onward eighteen
# boxes out. Page 2 IS uniform: `f2_N` = line N+11, for all 29 of Part III.
#
# ★★★ HOW THE ASSIGNMENT WAS CORROBORATED, rather than zipped in order:
#   1. PER-PAGE COUNTS. Page 1 carries exactly 30 money widgets and Part I+II is exactly 30 numbered
#      boxes (1, 2a-2t, 3, 4, 5-11); page 2 carries exactly 29 and Part III is exactly 29 (12-40).
#   2. THE INSET TRIO. Exactly three page-1 widgets are narrower than the rest — `f1_5`, `f1_9`,
#      `f1_22` at x=[508,572] (w=64) against every other box at [504,576] (w=72). The form prints
#      exactly three PARENTHESISED boxes: 2b, 2f, 2s. Under this assignment the two sets coincide
#      exactly, which no other offset achieves.
#   3. MONOTONIC y. Widget y descends strictly as the line number ascends, on both pages, with the
#      y-gaps matching the extract's multi-row blocks (lines 5, 7, 19 are tall).
#
# ★★ TWO SIGN CONVENTIONS ON ONE FORM, and they are not interchangeable:
#   · The three PARENTHESISED boxes (2b, 2f, 2s) have the minus printed for them, so the digits written
#     must be a POSITIVE MAGNITUDE. `Form6251::line2b` is stored NEGATIVE (i6251: "Enter the total as a
#     negative amount"), so writing it raw renders `(-500)` — a positive number on a filed form.
#   · Nine other lines (2c, 2d, 2k, 2l, 2n, 2o, 2p, 2q, 2r) and line 3 also say "enter as a negative
#     amount" but print NO parentheses — those take a literal minus sign. Line 1 may legitimately be
#     negative and is not parenthesised either.
#
# ★ SCOPE. btctax models 41 of the 59 boxes. Lines 2c-2t are censused, not mapped — see the census.

form = "f6251"
year = 2024

