"Form8283[0].Page1[0].Lines2a-c[0].c1_6[0]" = { line = "2a", rule = "unmodeled", reason = "Art (contribution of $20,000 or more) — btctax donates only BTC." }
"Form8283[0].Page1[0].Lines2a-c[0].c1_6[1]" = { line = "2b", rule = "unmodeled", reason = "Qualified conservation contribution — not modelled; this is why column (h) below is dead." }
