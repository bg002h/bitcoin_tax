# ── The FILER's identity (P6.3a D7): "Name(s) shown on your income tax return" + identifying number.
#    The crypto slice never writes these (its 8283 rides beside a return btctax did not produce); the
#    FULL-return path must, or it attaches an unnamed substantiation form. SSN cell is /MaxLen 11 ⇒
#    hyphenated.
[identity]
name = "Form8283[0].Page1[0].f1_01[0]"
ssn  = "Form8283[0].Page1[0].f1_02[0]"

# ★ Page 2 repeats the header so a detached Section B page can be tied to its return. DUMPED, not
#   inferred: this revision is f2_01/f2_02 (/MaxLen 11 ⇒ hyphenated), TY2025 is f2_1/f2_2, and the
#   Rev. 12-2014 form is p2-t1/p2-t2 with /MaxLen 12. Three revisions, three shapes.
# ★★★ Section B lines 5a/5b/5c — the RESTRICTION questions (§G-21). Written only when the filer
#   answered the return-level universal "did any donation have strings attached?" with NO; a YES
#   REFUSES the year upstream (`screen_compute_dependent`), so a "Yes" mark is unreachable by design.
