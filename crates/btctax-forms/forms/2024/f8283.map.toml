# Form 8283 (Rev. 12-2023) — the revision btctax files for TY2024 — logical cell → fully-qualified
# PDF field name. Every cell pinned by its own /Rect (do NOT trust names alone). Parts III/IV/V as
# 2025 (III Taxpayer stmt, IV Appraiser declaration, V Donee acknowledgment); has "k Digital assets".
#
# This map is identical to the Rev. 12-2025 (TY2025) map EXCEPT the Section A column-A/C field names,
# which are zero-padded on the 2023 revision (f1_05/f1_07/f1_08 vs 2025's f1_5/f1_7/f1_8) — verified
# at extraction; Section A cols D-I, all of Section B, and the page-2 identity fields are identical.
#
# Section A (page 1, Line 1) = 4 rows (A-D); Section B Part I (page 1, Line 3) = 3 rows (A-C).
# We FILL donee/appraiser IDENTITY + per-row property data; we leave BLANK every other party's
# declaration/signature.
form = "f8283"
year = 2024

