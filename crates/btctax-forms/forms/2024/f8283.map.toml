# ── §G-13 FIELD-PROVENANCE CENSUS ────────────────────────────────────────────────────────────────
# Every AcroForm field on this PDF the map above does not fill, with the decision that leaves it blank.
# `unmodeled` = btctax models no input that could reach the cell; `artifact` = not an entry the FILER
# makes; `gap` = the cell IS reachable and nothing populates it (a defect).
#
# ★ THE BUNDLED ASSET IS Rev. December 2023. `design/forms/periodic/f8283.pdf` is Rev. December 2025
#   and its sha256 does NOT match this crate's copy, so `design/forms/extract/f8283--periodic.txt` is
#   the wrong revision to transcribe from. The text behind this census was extracted from the bundled
#   PDF itself (`crates/btctax-forms/forms/2024/f8283.pdf`), which is the file the gate reads.
#
# ★★ TWO DEFECTS FOUND WHILE WRITING THIS SECTION — recorded as `gap`, 8 fields:
#      (1) Section B Part II lines 5a/5b/5c (6 fields) — three Yes/No declarations about restrictions
#          on the gift that btctax never asks. UNDERSTATEMENT direction.
#      (2) The page-2 identity header (2 fields) — btctax HAS the name and TIN and fills page 1's, but
#          the map declares no page-2 cells, so a filed page 2 carries no identifying header.
[census]

# ── Header: the pass-through-entity block ────────────────────────────────────────────────────────
# "Enter the entity name and identifying number from the tax return where the noncash charitable
# contribution was originally reported, if different from above." btctax reports the contribution on
# THIS return and models no pass-through entity — the same boundary censused on Schedule D lines 5/12,
# Schedule 3 line 6l and Form 8275 Part III.
"Form8283[0].Page1[0].f1_03[0]" = { line = "header entity name", rule = "unmodeled", reason = "Name of the entity whose return originally reported the contribution — btctax reports it on this return; no pass-through entity is modelled." }
"Form8283[0].Page1[0].f1_04[0]" = { line = "header entity TIN",  rule = "unmodeled", reason = "That entity's identifying number — same." }
"Form8283[0].Page1[0].c1_1[0]"  = { line = "header family PTE",  rule = "unmodeled", reason = "\"Check this box if a family pass-through entity made the noncash charitable contribution\" — no pass-through entity is modelled, so the box can never be checked." }

# ── Section A column (b) — the vehicle checkbox and its VIN comb, rows A-D ───────────────────────
# "If donated property is a vehicle, check the box. Also enter the vehicle identification number
# (unless Form 1098-C is attached)." btctax donates BTC; a vehicle donation is not expressible in the
# event model at all. The text cells are /MaxLen 17 — a VIN is exactly 17 characters.
"Form8283[0].Page1[0].Table_Line1_ColsA-C[0].Row1A[0].ColB[0].c1_2[0]" = { line = "A.A(b) vehicle", rule = "unmodeled", reason = "Section A row A vehicle checkbox — btctax donates BTC; no vehicle donation is expressible." }
"Form8283[0].Page1[0].Table_Line1_ColsA-C[0].Row1A[0].ColB[0].f1_06[0]" = { line = "A.A(b) VIN", rule = "unmodeled", reason = "Vehicle identification number (/MaxLen 17) — same." }
"Form8283[0].Page1[0].Table_Line1_ColsA-C[0].Row1B[0].ColB[0].c1_3[0]" = { line = "A.B(b) vehicle", rule = "unmodeled", reason = "Same — row B." }
"Form8283[0].Page1[0].Table_Line1_ColsA-C[0].Row1B[0].ColB[0].f1_09[0]" = { line = "A.B(b) VIN", rule = "unmodeled", reason = "Same — row B." }
"Form8283[0].Page1[0].Table_Line1_ColsA-C[0].Row1C[0].ColB[0].c1_4[0]" = { line = "A.C(b) vehicle", rule = "unmodeled", reason = "Same — row C." }
"Form8283[0].Page1[0].Table_Line1_ColsA-C[0].Row1C[0].ColB[0].f1_12[0]" = { line = "A.C(b) VIN", rule = "unmodeled", reason = "Same — row C." }
"Form8283[0].Page1[0].Table_Line1_ColsA-C[0].Row1D[0].ColB[0].c1_5[0]" = { line = "A.D(b) vehicle", rule = "unmodeled", reason = "Same — row D." }
"Form8283[0].Page1[0].Table_Line1_ColsA-C[0].Row1D[0].ColB[0].f1_15[0]" = { line = "A.D(b) VIN", rule = "unmodeled", reason = "Same — row D." }

