# ── Lines 4/5 and 11/12 — capital gains from other forms and pass-through entities ───────────────
# btctax's only disposition source is the BTC ledger. It models no installment sales (6252), casualties
# (4684), §1256 contracts (6781), like-kind exchanges (8824), §1231 property (4797), undistributed
# capital gains (2439), or K-1s from partnerships / S corporations / estates / trusts. Nothing in the
# input surface can reach these lines, so a blank here is what the inputs say.
#
# ★ These carry gains OR losses, so this omission is NOT direction-safe in the way an omitted deduction
#   is: a filer who actually has one of these forms has capital-gain sources btctax cannot see, and the
#   return is incomplete rather than merely conservative. That is a scope boundary of the product, not a
#   defect in this map — btctax emits a BTC return.
"topmostSubform[0].Page1[0].f1_19[0]" = { line = "4",  rule = "unmodeled", reason = "Short-term gain from Form 6252 and ST gain/(loss) from Forms 4684, 6781, 8824 — none of those forms are modelled." }
"topmostSubform[0].Page1[0].f1_20[0]" = { line = "5",  rule = "unmodeled", reason = "Net short-term gain/(loss) from partnerships, S corporations, estates and trusts (Schedule K-1) — btctax models no pass-through entities." }
"topmostSubform[0].Page1[0].f1_39[0]" = { line = "11", rule = "unmodeled", reason = "Gain from Form 4797 Part I; LT gain from Forms 2439 and 6252; LT gain/(loss) from Forms 4684, 6781, 8824 — none modelled." }
"topmostSubform[0].Page1[0].f1_40[0]" = { line = "12", rule = "unmodeled", reason = "Net long-term gain/(loss) from partnerships, S corporations, estates and trusts (Schedule K-1) — not modelled." }
