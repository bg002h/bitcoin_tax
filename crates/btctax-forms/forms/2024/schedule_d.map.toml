# Schedule D, tax year 2024 — logical line → fully-qualified PDF field name.
# Part I/II amount columns (d,e,g,h) live under Table_PartI / Table_PartII (the hardcoded
# SCHED_D_TABLE_TOKEN "Table_PartI" matches both, unchanged for 2024/2025). Line 16 sits on page 2.
# Field names match TY2025 EXCEPT line 16 (2024 = f2_01, not 2025's f2_1) — verified at extraction.
form = "schedule_d"
year = 2024

line3 = { proceeds_d = "topmostSubform[0].Page1[0].Table_PartI[0].Row3[0].f1_15[0]", cost_e = "topmostSubform[0].Page1[0].Table_PartI[0].Row3[0].f1_16[0]", adj_g = "topmostSubform[0].Page1[0].Table_PartI[0].Row3[0].f1_17[0]", gain_h = "topmostSubform[0].Page1[0].Table_PartI[0].Row3[0].f1_18[0]" }
line7_h = "topmostSubform[0].Page1[0].f1_22[0]"
line10 = { proceeds_d = "topmostSubform[0].Page1[0].Table_PartII[0].Row10[0].f1_35[0]", cost_e = "topmostSubform[0].Page1[0].Table_PartII[0].Row10[0].f1_36[0]", adj_g = "topmostSubform[0].Page1[0].Table_PartII[0].Row10[0].f1_37[0]", gain_h = "topmostSubform[0].Page1[0].Table_PartII[0].Row10[0].f1_38[0]" }
line15_h = "topmostSubform[0].Page1[0].f1_43[0]"
line16_h = "topmostSubform[0].Page2[0].f2_01[0]"

qof_yes = { field = "topmostSubform[0].Page1[0].c1_1[0]", on = "1" }
qof_no = { field = "topmostSubform[0].Page1[0].c1_1[1]", on = "2" }

# ── FULL-RETURN extension (P6). The crypto-slice fill above uses only lines 3/7/10/15/16; the
# full return additionally needs the carryovers, the capital-gain distributions, and Part III's
# lines 17-22. These keys are absent from the 2017/2025 maps, which is why they are optional.
#
# ★ PARENTHESIZED BOXES — the form pre-prints the minus sign, so these carry POSITIVE MAGNITUDES.
#   A negative written here renders as a POSITIVE number on a filed return.
#     line6  (f1_21, x=[507,573] inset)  short-term capital loss carryover
#     line14 (f1_42, x=[507,573] inset)  long-term capital loss carryover
#     line21 (f2_04, x=[492.6,573])      the §1211(b) allowed loss offset
#
# ★ THE AMOUNT COLUMN DIFFERS BETWEEN THE TWO PAGES OF THE SAME FORM: page 1's column (h) and its
#   standalone cells are x=[504,576] (center 540); page 2's are x=[489.6,576] (center 532.8). One
#   band covering both (489-576) holds each center, so the oracle needs no per-page cluster — but a
#   band pinned to page 1 alone would REJECT every page-2 cell.
line6  = "topmostSubform[0].Page1[0].f1_21[0]"   # "Short-term capital loss carryover…"   ★ PAREN
line13 = "topmostSubform[0].Page1[0].f1_41[0]"   # "Capital gain distributions" (Σ 1099-DIV box 2a)
line14 = "topmostSubform[0].Page1[0].f1_42[0]"   # "Long-term capital loss carryover…"    ★ PAREN
line18 = "topmostSubform[0].Page2[0].f2_02[0]"   # 28% Rate Gain Worksheet (always 0 — refused upstream)
line19 = "topmostSubform[0].Page2[0].f2_03[0]"   # Unrecaptured §1250 Worksheet (always 0 — refused)
line21 = "topmostSubform[0].Page2[0].TagCorrectingSubform[0].f2_04[0]"  # §1211(b) offset  ★ PAREN

# Part III's three Yes/No pairs. Every pair on this form shares the same on-states ("1"/"2"), so only
# the field name distinguishes them.
[line17]   # "Are lines 15 and 16 both gains?"
yes = { field = "topmostSubform[0].Page2[0].c2_1[0]", on = "1" }
no  = { field = "topmostSubform[0].Page2[0].c2_1[1]", on = "2" }
[line20]   # "Are lines 18 and 19 both zero or blank and you are not filing Form 4952?"
yes = { field = "topmostSubform[0].Page2[0].c2_2[0]", on = "1" }
no  = { field = "topmostSubform[0].Page2[0].c2_2[1]", on = "2" }
[line22]   # "Do you have qualified dividends on Form 1040…, line 3a?"
yes = { field = "topmostSubform[0].Page2[0].c2_3[0]", on = "1" }
no  = { field = "topmostSubform[0].Page2[0].c2_3[1]", on = "2" }

# ── Identity header (P6.2). Dumped + correlated against the printed form; the SSN cell declares
#    /MaxLen 11, so it takes the HYPHENATED form (the 1040's own SSN cells are /MaxLen 9 and take
#    bare digits — the forms genuinely differ, so `push_identity` reads each cell's capacity).
[identity]
name = "topmostSubform[0].Page1[0].f1_01[0]"
ssn  = "topmostSubform[0].Page1[0].f1_02[0]"

# ── §G-13 FIELD-PROVENANCE CENSUS ────────────────────────────────────────────────────────────────
# Every AcroForm field on this PDF that the map above does not fill, with the decision that leaves it
# blank. `unmodeled` = btctax models no input that could reach the line; `artifact` = the field is not
# an entry the filer makes; `gap` = the line IS reachable and nothing populates it (a defect).
#
# ★ Schedule D's whole unmapped surface is TWO decisions, both already load-bearing elsewhere in the
#   codebase — the 8949 box choice and the absence of any non-BTC capital-gain source.
[census]

# ── Lines 1a/1b/2 and 8a/8b/9 — the 8949 Box A/B/D/E aggregate rows ──────────────────────────────
# btctax NEVER emits the 1099-reported boxes. `btctax-core/src/forms.rs` (the `Form8949Box` enum, D4):
# the model carries no 1099-B / 1099-DA signal, so asserting "a broker form was issued and basis was
# reported" would fabricate unsubstantiated testimony. Every disposition is routed to the conservative
# not-reported box — C/F pre-TY2025, I/L from TY2025 — which lands on line 3 (ST) and line 10 (LT),
# both mapped above. `Form8949Row::box_needs_review` flags exchange dispositions for reclassification
# by the filer on the actual return.
#
# ★ DIRECTION: this cannot change the tax. Line 7 combines lines 1a THROUGH 6 in column (h) and line 15
#   combines 8a through 14, so the amount reaches the same total from any row. Choosing the wrong row
#   is an IRS document-matching concern, not an arithmetic one — which is exactly why the conservative
#   box is a safe default and the review flag is the right actuator.
#
# Line 1a is additionally the only row that reports transactions NOT listed on Form 8949 at all (the
# "basis reported, no adjustments" shortcut). btctax always lists every disposition, so 1a is unused
# by construction, not merely unpopulated.
"topmostSubform[0].Page1[0].Table_PartI[0].Row1a[0].f1_03[0]"    = { line = "1a(d)", rule = "unmodeled", reason = "Box A aggregate, proceeds. btctax never emits Box A (no 1099-B signal — forms.rs D4); ST dispositions go to line 3." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row1a[0].f1_04[0]"    = { line = "1a(e)", rule = "unmodeled", reason = "Box A aggregate, cost basis — same." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row1a[0].f1_05_RO[0]" = { line = "1a(g)", rule = "unmodeled", reason = "Box A aggregate, adjustments — same. btctax emits no 8949 adjustment codes at all (column (f)/(g) are always empty)." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row1a[0].f1_06[0]"    = { line = "1a(h)", rule = "unmodeled", reason = "Box A aggregate, gain/loss — same." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row1b[0].f1_07[0]"    = { line = "1b(d)", rule = "unmodeled", reason = "Box A (reported on 8949) aggregate, proceeds — btctax never assigns Box A." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row1b[0].f1_08[0]"    = { line = "1b(e)", rule = "unmodeled", reason = "Box A aggregate, cost basis — same." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row1b[0].f1_09[0]"    = { line = "1b(g)", rule = "unmodeled", reason = "Box A aggregate, adjustments — same." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row1b[0].f1_10[0]"    = { line = "1b(h)", rule = "unmodeled", reason = "Box A aggregate, gain/loss — same." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row2[0].f1_11[0]"     = { line = "2(d)",  rule = "unmodeled", reason = "Box B (1099-B issued, basis NOT reported) aggregate, proceeds — btctax never assigns Box B." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row2[0].f1_12[0]"     = { line = "2(e)",  rule = "unmodeled", reason = "Box B aggregate, cost basis — same." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row2[0].f1_13[0]"     = { line = "2(g)",  rule = "unmodeled", reason = "Box B aggregate, adjustments — same." }
"topmostSubform[0].Page1[0].Table_PartI[0].Row2[0].f1_14[0]"     = { line = "2(h)",  rule = "unmodeled", reason = "Box B aggregate, gain/loss — same." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row8a[0].f1_23[0]"    = { line = "8a(d)", rule = "unmodeled", reason = "Box D aggregate, proceeds. LT dispositions go to line 10; btctax never assigns Box D." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row8a[0].f1_24[0]"    = { line = "8a(e)", rule = "unmodeled", reason = "Box D aggregate, cost basis — same." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row8a[0].f1_25_RO[0]" = { line = "8a(g)", rule = "unmodeled", reason = "Box D aggregate, adjustments — same; no 8949 adjustment codes are ever emitted." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row8a[0].f1_26[0]"    = { line = "8a(h)", rule = "unmodeled", reason = "Box D aggregate, gain/loss — same." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row8b[0].f1_27[0]"    = { line = "8b(d)", rule = "unmodeled", reason = "Box D (reported on 8949) aggregate, proceeds — same." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row8b[0].f1_28[0]"    = { line = "8b(e)", rule = "unmodeled", reason = "Box D aggregate, cost basis — same." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row8b[0].f1_29[0]"    = { line = "8b(g)", rule = "unmodeled", reason = "Box D aggregate, adjustments — same." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row8b[0].f1_30[0]"    = { line = "8b(h)", rule = "unmodeled", reason = "Box D aggregate, gain/loss — same." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row9[0].f1_31[0]"     = { line = "9(d)",  rule = "unmodeled", reason = "Box E (1099-B issued, basis NOT reported) aggregate, proceeds — btctax never assigns Box E." }
"topmostSubform[0].Page1[0].Table_PartII[0].Row9[0].f1_32[0]"     = { line = "9(e)",  rule = "unmodeled", reason = "Box E aggregate, cost basis — same." }
