# Form 8960 (Net Investment Income Tax, §1411), tax year 2024 — logical line → PDF field name.
#
# Extracted with `cargo run -p xtask -- dump-fields crates/btctax-forms/forms/2024/f8960.pdf` and
# correlated against the printed form (`pdftotext -layout`). The blank carries 35 text fields
# (f1_1 = name, f1_2 = SSN/EIN, then f1_3..f1_35 in unbroken reading order) + 3 checkboxes.
#
# NOTE the suffix offset is NOT a simple `line + k`: it holds only for lines 1–3, then the lettered
# sub-lines (4a–4c, 5a–5d, 9a–9d) make the printed number and the suffix diverge permanently. Every
# entry below was pinned against its printed label, never extrapolated.
#
# Column x-clusters (the code-side oracle lives in form8960.rs): MID x ≈ [410,482], AMOUNT x ≈ [504,576]
# — the same two as Schedule SE / Form 8959.
#
# UNMAPPED ON PURPOSE — left BLANK on the filed form because v1 does not model them, and a map entry
# would invite a future filler to write a misleading 0:
#   line 3   (f1_5)          annuities
#   lines 4a-4c (f1_6..f1_8) Schedule E (rental/royalty/K-1) — UNREPRESENTABLE in v1
#   line 6   (f1_13)         CFC/PFIC adjustments — MAGI is fail-closed to AGI
#   lines 9a-9c (f1_16..f1_18) + line 10 (f1_20) — investment expenses / additional modifications
#   lines 18a-21 (f1_28..f1_35) Part III ESTATES AND TRUSTS — must stay blank on an individual return
#   the 3 Part I election checkboxes (§6013(g), §6013(h), §1.1411-10(g)) — v1 makes no election
#
# The DERIVED totals 9d and 11 ARE filled, at zero: the form's own arithmetic adds them (line 12 =
# line 8 − line 11), so a reader re-adding the column must find them.
form = "f8960"
year = 2024

# ── Part I — Investment Income ──────────────────────────────────────────────────────────────────
line1  = "topmostSubform[0].Page1[0].f1_3[0]"    # "Taxable interest (see instructions)"
line2  = "topmostSubform[0].Page1[0].f1_4[0]"    # "Ordinary dividends (see instructions)"
line5a = "topmostSubform[0].Page1[0].f1_9[0]"    # "Net gain or loss from disposition of property"
line5d = "topmostSubform[0].Page1[0].f1_12[0]"   # "Combine lines 5a through 5c"
line7  = "topmostSubform[0].Page1[0].f1_14[0]"   # "Other modifications to investment income"
line8  = "topmostSubform[0].Page1[0].f1_15[0]"   # "Total investment income. Combine lines 1, 2, 3, 4c, 5d, 6, and 7"

# ── Part II — Investment Expenses Allocable to Investment Income and Modifications ──────────────
line9d = "topmostSubform[0].Page1[0].f1_19[0]"   # "Add lines 9a, 9b, and 9c"
line11 = "topmostSubform[0].Page1[0].f1_21[0]"   # "Total deductions and modifications. Add lines 9d and 10"

# ── Part III — Tax Computation (INDIVIDUALS; the estates/trusts branch stays blank) ─────────────
line12 = "topmostSubform[0].Page1[0].f1_22[0]"   # "Net investment income. Subtract Part II, line 11, from Part I, line 8"
line13 = "topmostSubform[0].Page1[0].f1_23[0]"   # "Modified adjusted gross income"
line14 = "topmostSubform[0].Page1[0].f1_24[0]"   # "Threshold based on filing status" — FILLABLE, not pre-printed
line15 = "topmostSubform[0].Page1[0].f1_25[0]"   # "Subtract line 14 from line 13. If zero or less, enter -0-"
line16 = "topmostSubform[0].Page1[0].f1_26[0]"   # "Enter the smaller of line 12 or line 15"
line17 = "topmostSubform[0].Page1[0].f1_27[0]"   # "Multiply line 16 by 3.8% (0.038)" → Schedule 2 line 12

# ── Identity header (P6.2). Dumped + correlated against the printed form; the SSN cell declares
#    /MaxLen 11, so it takes the HYPHENATED form (the 1040's own SSN cells are /MaxLen 9 and take
#    bare digits — the forms genuinely differ, so `push_identity` reads each cell's capacity).
[identity]
name = "topmostSubform[0].Page1[0].f1_1[0]"
ssn  = "topmostSubform[0].Page1[0].f1_2[0]"

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# ★★★ THE FIELD CENSUS (§G-13). See f8959.map.toml for the rule vocabulary.
#
# btctax computes NIIT for an INDIVIDUAL from interest (1), dividends (2), and gain on disposition
# (5a/5d), then lines 7–17. Everything below is income, a deduction, or an election it does not model
# — each one FORGONE, which for income lines means the tax can only be OVERSTATED, never understated.
[census]

# ── Part I elections btctax does not offer ───────────────────────────────────────────────────────
"topmostSubform[0].Page1[0].PartI[0].c1_1[0]" = { line = "6013(g)", rule = "unmodeled", reason = "Section 6013(g) election (nonresident-alien spouse treated as a resident) — btctax offers no such election." }
"topmostSubform[0].Page1[0].PartI[0].c1_2[0]" = { line = "6013(h)", rule = "unmodeled", reason = "Section 6013(h) election — same; not offered." }
"topmostSubform[0].Page1[0].PartI[0].c1_3[0]" = { line = "1.1411-10(g)", rule = "unmodeled", reason = "Regulations section 1.1411-10(g) election (CFC/PFIC) — btctax models no CFCs or PFICs." }

# ── Investment income btctax does not model ──────────────────────────────────────────────────────
"topmostSubform[0].Page1[0].f1_5[0]"  = { line = "3",  rule = "unmodeled", reason = "Annuities — not modelled; omitting income can only overstate the tax." }
"topmostSubform[0].Page1[0].f1_6[0]"  = { line = "4a", rule = "unmodeled", reason = "Rental real estate, royalties, partnerships, S corporations, trusts — none modelled." }
"topmostSubform[0].Page1[0].f1_7[0]"  = { line = "4b", rule = "unmodeled", reason = "Adjustment for net income/loss from a non-section-1411 trade or business — dead with line 4a blank." }
"topmostSubform[0].Page1[0].f1_8[0]"  = { line = "4c", rule = "unmodeled", reason = "Combine 4a and 4b — dead with both blank." }
"topmostSubform[0].Page1[0].f1_10[0]" = { line = "5b", rule = "unmodeled", reason = "Net gain/loss from disposition of property NOT subject to NIIT — btctax's dispositions are all §1411 property, so there is nothing to back out." }
"topmostSubform[0].Page1[0].f1_11[0]" = { line = "5c", rule = "unmodeled", reason = "Adjustment from disposition of a partnership interest or S-corp stock — not modelled." }
"topmostSubform[0].Page1[0].f1_13[0]" = { line = "6",  rule = "unmodeled", reason = "Adjustments to investment income for certain CFCs and PFICs — not modelled." }

# ── Part II deductions btctax does not model ─────────────────────────────────────────────────────
"topmostSubform[0].Page1[0].f1_16[0]" = { line = "9a", rule = "unmodeled", reason = "Investment interest expenses — a DEDUCTION against NII; forgoing it can only overstate the tax." }
"topmostSubform[0].Page1[0].f1_17[0]" = { line = "9b", rule = "unmodeled", reason = "State/local/foreign income tax allocable to NII — not modelled." }
"topmostSubform[0].Page1[0].f1_18[0]" = { line = "9c", rule = "unmodeled", reason = "Miscellaneous investment expenses — not modelled." }
"topmostSubform[0].Page1[0].f1_20[0]" = { line = "10", rule = "unmodeled", reason = "Additional modifications — not modelled; line 11 therefore equals line 9d." }

# ── Part III: ESTATES AND TRUSTS — a filer type btctax never serves ──────────────────────────────
# btctax emits a Form 1040 (individual). It has no 1041 path at all, so every line of Part III is
# structurally unreachable, not merely unmodelled.
"topmostSubform[0].Page1[0].f1_28[0]" = { line = "18a", rule = "unmodeled", reason = "Estates and Trusts: net investment income. btctax emits an individual Form 1040 and has no Form 1041 path — all of Part III is unreachable." }
"topmostSubform[0].Page1[0].f1_29[0]" = { line = "18b", rule = "unmodeled", reason = "Estates/trusts: deductions for distributions of NII — Part III, unreachable." }
"topmostSubform[0].Page1[0].f1_30[0]" = { line = "18c", rule = "unmodeled", reason = "Estates/trusts: undistributed NII — Part III, unreachable." }
"topmostSubform[0].Page1[0].f1_31[0]" = { line = "19a", rule = "unmodeled", reason = "Estates/trusts: adjusted gross income — Part III, unreachable." }
"topmostSubform[0].Page1[0].f1_32[0]" = { line = "19b", rule = "unmodeled", reason = "Estates/trusts: highest tax-bracket threshold — Part III, unreachable." }
"topmostSubform[0].Page1[0].f1_33[0]" = { line = "19c", rule = "unmodeled", reason = "Estates/trusts: subtract 19b from 19a — Part III, unreachable." }
"topmostSubform[0].Page1[0].f1_34[0]" = { line = "20",  rule = "unmodeled", reason = "Estates/trusts: smaller of 18c or 19c — Part III, unreachable." }
"topmostSubform[0].Page1[0].f1_35[0]" = { line = "21",  rule = "unmodeled", reason = "Estates/trusts: NIIT, line 20 × 3.8% — Part III, unreachable." }
