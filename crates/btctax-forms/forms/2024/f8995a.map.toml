line16 = "topmostSubform[0].Page1[0].Table_PartII[0].Row16[0].f1_51[0]"

# ── Part III — Phased-in Reduction (COLUMN A, and the five single-entry lines) ───────────────────
#
# ★★★ LINES 20-24 ARE NOT COLUMN-A FIELDS. Each of those rows carries FOUR widgets: one at
# x≈[266.4,337.6] named `LnNN[0].f2_NN[0]`, plus three at the A/B/C positions whose names end `_RO`.
# The `_RO` trio is the form's own READ-ONLY replication, filled by its JavaScript so the per-column
# arithmetic works inside Acrobat; btctax drops XFA and sets NeedAppearances, so that script never
# runs and writing them is not ours to do. The figure is a RETURN-LEVEL one (taxable income, the
# threshold, the range, the percentage) and the form gives it one entry box — the `Ln` field. That is
# the box a hand-filer writes in, and it is the only one written here.
#
# ★ Lines 17, 18, 19, 25 and 26 ARE per-business, and take column A like Part II.
[part3_col_a]
# 17 "Enter the amounts from line 3"
line17 = "topmostSubform[0].Page2[0].Table_PartIII[0].Row17[0].f2_01[0]"
# 18 "Enter the amounts from line 10"
line18 = "topmostSubform[0].Page2[0].Table_PartIII[0].Row18[0].f2_04[0]"
# 19 "Subtract line 18 from line 17"
line19 = "topmostSubform[0].Page2[0].Table_PartIII[0].Row19[0].f2_07[0]"
# 20 "Taxable income before qualified business
#     income deduction"
line20 = "topmostSubform[0].Page2[0].Table_PartIII[0].Row20[0].Ln20[0].f2_10[0]"
# 21 "Threshold. Enter $191,950 ($383,900 if
#     married filing jointly)"
