# 22 "Subtract line 21 from line 20"
line22 = "topmostSubform[0].Page2[0].Table_PartIII[0].Row22[0].Ln22[0].f2_18[0]"
# 23 "Phase-in range. Enter $50,000 ($100,000 if
#     married filing jointly)"
line23 = "topmostSubform[0].Page2[0].Table_PartIII[0].Row23[0].Ln23[0].f2_22[0]"
# 24 "Phase-in percentage. Divide line 22 by line 23"  — a PERCENTAGE; the form prints the % sign
line24 = "topmostSubform[0].Page2[0].Table_PartIII[0].Row24[0].Ln24[0].f2_26[0]"
# 25 "Total phase-in reduction. Multiply line 19 by line 24"
line25 = "topmostSubform[0].Page2[0].Table_PartIII[0].Row25[0].f2_30[0]"
# 26 "Qualified business income after phase-in reduction. Subtract line
#     25 from line 17. Enter this amount here and on line 12, for the
#     corresponding trade or business"
line26 = "topmostSubform[0].Page2[0].Table_PartIII[0].Row26[0].f2_33[0]"

# ── Header ───────────────────────────────────────────────────────────────────────────────────────
# REQUIRED, like every full-return schedule: a form that does not name its taxpayer is not filable.
#
# ★ LAST on purpose. TOML binds every bare key after a table header INTO that table, so an `[identity]`
#   block placed above the `lineNN` keys silently swallows all fourteen of them — the parse then fails
#   with "missing field `line27`", which reads like a typo and is really a layout error.
[identity]
name = "topmostSubform[0].Page1[0].f1_01[0]"
ssn  = "topmostSubform[0].Page1[0].f1_02[0]"

