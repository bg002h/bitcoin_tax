# Form 8275 (Disclosure Statement), Rev. October 2024 — the OFFICIAL IRS fillable PDF's AcroForm field
# map. This is the ONE bundled revision, aliased to EVERY SUPPORTED_YEAR (2017/2024/2025) by
# `Form8275Map::for_year` — Form 8275 is revision-versioned, not tax-year-versioned, so there is no
# separate 2017/2025 copy of this file (see `map.rs`'s module doc + `pdf.rs::f8275_pdf`).
#
# Column (a) "Rev. Rul., Rev. Proc., etc." and column (e) "Line No." (a genuine 3-character comb cell)
# are deliberately UNMAPPED — see `Form8275Row`'s doc comment for why.
form = "f8275"
year = 2024
part_ii_narrative = "topmostSubform[0].Page1[0].p1-t80[0]"
# Part II lines 2-6 — MAPPED BUT DELIBERATELY NOT WRITTEN. The PDF's static page content prints the
# numerals "1 ".."6 " beside p1-t80..p1-t85, and they correspond to Part I's rows, so a single combined
# narrative must not be wrapped across them. Overflow goes to Part IV instead.
part_ii_continuation = [
    "topmostSubform[0].Page1[0].p1-t81[0]",
    "topmostSubform[0].Page1[0].p1-t82[0]",
    "topmostSubform[0].Page1[0].p1-t83[0]",
    "topmostSubform[0].Page1[0].p1-t84[0]",
    "topmostSubform[0].Page1[0].p1-t85[0]",
]
# Page-2 Part IV "Explanations (continued from Parts I and/or II)" — the 27 continuation lines the
# narrative overflows into once Part II LINE 1 is full. The first line used carries a
# "Part II, line 1 (continued):" prefix, per the IRS Rev. 10-2024 Specific Instructions.
part_iv_continuation = [
    "topmostSubform[0].Page2[0].p2-t1[0]",
    "topmostSubform[0].Page2[0].p2-t2[0]",
