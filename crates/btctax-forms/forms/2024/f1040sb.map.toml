# ── Identity header (P6.2). Dumped + correlated against the printed form; the SSN cell declares
#    /MaxLen 11, so it takes the HYPHENATED form (the 1040's own SSN cells are /MaxLen 9 and take
#    bare digits — the forms genuinely differ, so `push_identity` reads each cell's capacity).
[identity]
name = "topmostSubform[0].Page1[0].f1_01[0]"
ssn  = "topmostSubform[0].Page1[0].f1_02[0]"

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# ★★★ THE FIELD CENSUS (§G-13). Every AcroForm field accounted for exactly once: mapped above, or
# named here with the rule saying why not. See f8959.map.toml for the rule vocabulary.

# ★★★ R2.2 — THE `[direction]` TABLE. Each block's `caption` is asserted VERBATIM against
#     design/forms/extract/f1040sb--2024.txt at `extract_line` BEFORE the join uses it, so this table
#     is a READING of the form and a re-parted revision REDS rather than drifting. A census entry
#     is placed by its own line number into the block whose [first_line, last_line] range contains
#     it; an entry with no printed line number carries `part = "<caption>"`. An entry no block
#     places REDS — it is never defaulted to Overstates.
#
#
#     ★★★ A BLOCK STATES NO DIRECTION, and that absence is the guarantee. It records only what the
#     form PRINTS: the caption and the lines it heads. Which way a blank inside it moves the tax is
#     READ from the caption in one reviewed place — `xtask::census_join::DIRECTION_OF_CAPTION` —
#     where each reading cites the form's own total sentence (the total these lines are combined
#     into, and the line of the 1040 that total goes to) as its evidence. `DirectionBlock` carries
#     `deny_unknown_fields`, so a `direction = "..."` key here is a PARSE ERROR, not a judgement
#     nobody checked.
[[direction]]
caption      = "Interest and Ordinary Dividends"
extract_line = 6
first_line   = "1"
last_line    = "8"

# ★★★ R2.2's DERIVED FLIP. Schedule B is a whole-form `Understates` key, and line 4 prints the form's
#     own exception: line 3 is SUBTRACTED from line 2, so it is a REDUCTION of interest income and a
#     blank there OVERSTATES the tax. The sentence is asserted verbatim at this extract line and the
#     subtracted line number is parsed OUT of it, so nothing is typed per entry.
[[subtracts]]
sentence     = "Subtract line 3 from line 2"
extract_line = 38

[census]
"topmostSubform[0].Page1[0].f1_32[0]" = { line = "3", rule = "unmodeled", reason = "Excludable interest on series EE and I U.S. savings bonds issued after 1989 (attach Form 8815) — btctax models no Form 8815, so line 4 = line 2.", covered_by = "Advisory::UnmodeledDeductionsOmitted" }
"topmostSubform[0].Page1[0].f1_66[0]" = { line = "7b", rule = "unmodeled", reason = "SECOND line of the 7b foreign-country list; btctax writes only the first (f1_65). Not a silent truncation: an over-long value FAILS CLOSED at verify.rs:516, so a list needing two lines refuses rather than clipping.", covered_by = "RefuseReason::ScheduleBForeignCountryMissing" }

