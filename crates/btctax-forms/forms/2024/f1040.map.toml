# Form 1040 (2024), capital-gains cells ONLY — logical cell → fully-qualified PDF field name.
# Amount column x-cluster (hand-pinned): [504,576]. Capital gain is on LINE 7 (2024 is NOT split into
# 7a/7b like 2025): f1_52 [504,162,576,174].
# Digital-Asset question is a same-y {/1,/2} /Btn pair at y≈487 selected map-independently by the
# horizontal-ADJACENCY oracle (topmost_yes_no_pair): the two boxes are ~36pt apart, vs the
# filing-status {/1,/2} row higher up whose boxes are ~266pt apart (NOT adjacent → rejected).
# Yes = c1_5[0] (LEFT, on-state /1); No = c1_5[1] (on-state /2).
form = "f1040"
year = 2024

# The capital-gain amount cell (line 7 for 2024). The struct field is named `line7a` for cross-year
# uniformity; the value here is 2024's line-7 field.
line7a = "topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_52[0]"
# da_present = true → this year HAS the Digital-Asset question (the adjacency guard runs). A future
# no-DA year (2017) sets da_present = false and makes da_yes/da_no optional.
da_present = true
da_yes = { field = "topmostSubform[0].Page1[0].c1_5[0]", on = "1" }
da_no = { field = "topmostSubform[0].Page1[0].c1_5[1]", on = "2" }

# ─────────────────────────── FULL-RETURN extension (P6) ────────────────────────────────────────
# The crypto-slice fill above writes only line 7 + the Digital-Asset question. The full return needs
# every line. These keys are absent from the 2017/2025 maps, hence optional.
#
# ★ THREE x-clusters on this form:
#     SUBLINE x ≈ [252, 324]   the lettered "a" sub-lines (2a tax-exempt interest, 3a qualified div)
#     MID     x ≈ [410, 482]   25a/25b/25c, 31
#     AMOUNT  x ≈ [504, 576]   everything else
#
# ★ f1_57 IS LINE 12 ON THE 2024 FORM AND LINE 1z ON THE 2025 ONE (SPEC §7.4). The maps are
#   per-(form, year) for exactly this reason. Never share a field-name constant across years.
#
# ★★ THE FILING-STATUS GROUP IS A NAME COLLISION. There are TWO distinct fields called `c1_3[0]` and
#    TWO called `c1_3[1]`, distinguished ONLY by their parent subform:
#        FilingStatus_ReadOrder[0].c1_3[0]  = Single   (on "1")
#                          ...  .c1_3[0]  = HoH      (on "2")   ← same leaf name, no wrapper!
#        FilingStatus_ReadOrder[0].c1_3[1]  = MFJ      (on "3")
#                          ...  .c1_3[1]  = QSS      (on "5")   ← same leaf name, no wrapper!
#        FilingStatus_ReadOrder[0].c1_3[2]  = MFS      (on "4")
#    A map that used the leaf name would silently check the WRONG FILING STATUS. The on-states
#    (1=Single, 2=HoH, 3=MFJ, 4=MFS, 5=QSS) are distinct and independently corroborate the mapping —
#    which is why the filler asserts BOTH the fully-qualified name and the on-state.

# ── Page 1: income → taxable income ────────────────────────────────────────────────────────────
# ★ L1a — "Total amount from Form(s) W-2, box 1". Correlated by counting the AMOUNT-column boxes down
#   from 1a: f1_32=1a, f1_33=1b … f1_39=1h, f1_40=1i (the MID-column combat-pay election), f1_41=1z.
#   Without it the filed 1z sat above an EMPTY operand column and "Add lines 1a through 1h" summed
#   blanks to 0 ≠ 1z — on the line the Service document-matches against your W-2s (Fable P6 r1 I1).
line1a = "topmostSubform[0].Page1[0].f1_32[0]"                              # Σ W-2 box 1           AMOUNT
line1z = "topmostSubform[0].Page1[0].f1_41[0]"                              # add 1a–1h             AMOUNT
# L2a — the SUBLINE column at the same printed row as 2b (f1_42 sits at x≈252-323, y=234-246; f1_43 is
# the AMOUNT cell on that row). Anchored by the identical 3a/3b pair one row below (f1_44 / f1_45).
line2a = "topmostSubform[0].Page1[0].f1_42[0]"                              # tax-exempt interest   SUBLINE
line2b = "topmostSubform[0].Page1[0].f1_43[0]"                             # taxable interest      AMOUNT
line3a = "topmostSubform[0].Page1[0].f1_44[0]"                             # qualified dividends   SUBLINE ★
line3b = "topmostSubform[0].Page1[0].f1_45[0]"                             # ordinary dividends    AMOUNT
line8  = "topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_53[0]"      # Sch 1 L10             AMOUNT
line9  = "topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_54[0]"      # total income          AMOUNT
line10 = "topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_55[0]"      # Sch 1 L26             AMOUNT
line11 = "topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_56[0]"      # AGI                   AMOUNT
line12 = "topmostSubform[0].Page1[0].f1_57[0]"                             # deduction  ★ f1_57    AMOUNT
line13 = "topmostSubform[0].Page1[0].f1_58[0]"                             # QBI (8995 L15)        AMOUNT
line14 = "topmostSubform[0].Page1[0].f1_59[0]"                             # 12 + 13               AMOUNT
line15 = "topmostSubform[0].Page1[0].f1_60[0]"                             # TAXABLE INCOME        AMOUNT

# ── Page 2: tax → total tax → payments → refund/owed ───────────────────────────────────────────
line16  = "topmostSubform[0].Page2[0].f2_02[0]"   # tax
line17  = "topmostSubform[0].Page2[0].f2_03[0]"   # Sch 2 L3 (always 0 in v1)
line18  = "topmostSubform[0].Page2[0].f2_04[0]"   # 16 + 17
line19  = "topmostSubform[0].Page2[0].f2_05[0]"   # CTC/ODC — always 0 (conservative omission)
line20  = "topmostSubform[0].Page2[0].f2_06[0]"   # Sch 3 L8
line21  = "topmostSubform[0].Page2[0].f2_07[0]"   # 19 + 20
line22  = "topmostSubform[0].Page2[0].f2_08[0]"   # 18 − 21
line23  = "topmostSubform[0].Page2[0].f2_09[0]"   # Sch 2 L21
line24  = "topmostSubform[0].Page2[0].f2_10[0]"   # TOTAL TAX
line25a = "topmostSubform[0].Page2[0].f2_11[0]"   # W-2 withholding        MID
line25b = "topmostSubform[0].Page2[0].f2_12[0]"   # 1099 withholding       MID
line25c = "topmostSubform[0].Page2[0].f2_13[0]"   # other (8959 L24)       MID
line25d = "topmostSubform[0].Page2[0].f2_14[0]"   # 25a + 25b + 25c
line26  = "topmostSubform[0].Page2[0].f2_15[0]"   # estimated payments
line31  = "topmostSubform[0].Page2[0].f2_20[0]"   # Sch 3 L15              MID
line32  = "topmostSubform[0].Page2[0].f2_21[0]"   # 27-31 total
line33  = "topmostSubform[0].Page2[0].f2_22[0]"   # TOTAL PAYMENTS
line34  = "topmostSubform[0].Page2[0].f2_23[0]"   # overpayment
line35a = "topmostSubform[0].Page2[0].f2_24[0]"   # refunded to you
line37  = "topmostSubform[0].Page2[0].f2_28[0]"   # AMOUNT YOU OWE

# UNMAPPED ON PURPOSE: the direct-deposit block (35b routing f2_25, 35c/d account f2_26) — v1 never
# fills it, so a refund arrives as a paper check and the RefundByPaperCheck advisory says so. Line 36
# (apply to next year) is pinned blank. Lines 27-30 (EIC, additional CTC, AOC) are §3.4 conservative
# omissions and stay BLANK, never a misleading 0.

# ── The 5-way filing-status group. Fully-qualified names ONLY — see the collision note above. ──
[filing_status]
single = { field = "topmostSubform[0].Page1[0].FilingStatus_ReadOrder[0].c1_3[0]", on = "1" }
hoh    = { field = "topmostSubform[0].Page1[0].c1_3[0]",                            on = "2" }
mfj    = { field = "topmostSubform[0].Page1[0].FilingStatus_ReadOrder[0].c1_3[1]", on = "3" }
mfs    = { field = "topmostSubform[0].Page1[0].FilingStatus_ReadOrder[0].c1_3[2]", on = "4" }
qss    = { field = "topmostSubform[0].Page1[0].c1_3[1]",                            on = "5" }

# ── Identity block (P6.2) ──────────────────────────────────────────────────────────────────────────
# Dumped with `xtask dump-fields` and correlated line-by-line against `pdftotext -layout`. NOTHING here
# is extrapolated from a sibling form: the 1040's SSN cells declare /MaxLen 9 (comb) and take the nine
# BARE digits, while every schedule's SSN cell is /MaxLen 11 and takes the hyphenated form.
#
# The four Age/Blindness boxes sit on ONE printed row (y ≈ 440.5), left→right:
#   c1_9  = "You: Were born before January 2, 1960"     c1_10 = "You: Are blind"
#   c1_11 = "Spouse: Was born before January 2, 1960"   c1_12 = "Spouse: Is blind"
# They are GATING: the IRS validates a nonstandard standard deduction by counting them against L12.
[header]
taxpayer_first  = "topmostSubform[0].Page1[0].f1_04[0]"
taxpayer_last   = "topmostSubform[0].Page1[0].f1_05[0]"
taxpayer_ssn    = "topmostSubform[0].Page1[0].f1_06[0]"
spouse_first    = "topmostSubform[0].Page1[0].f1_07[0]"
spouse_last     = "topmostSubform[0].Page1[0].f1_08[0]"
spouse_ssn      = "topmostSubform[0].Page1[0].f1_09[0]"
address_street  = "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_10[0]"
address_apt     = "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_11[0]"
address_city    = "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_12[0]"
address_state   = "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_13[0]"
address_zip     = "topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_14[0]"
mfs_spouse_name = "topmostSubform[0].Page1[0].f1_18[0]"
# The page-2 signature block: occupations and the taxpayer's IP PIN (a 6-character comb — the spouse's
# IP PIN cell exists (f2_36) but ReturnInputs does not capture one, so it is left BLANK, never guessed).
occupation_taxpayer = "topmostSubform[0].Page2[0].f2_33[0]"
occupation_spouse   = "topmostSubform[0].Page2[0].f2_35[0]"
ip_pin              = "topmostSubform[0].Page2[0].f2_34[0]"

presidential_taxpayer      = { field = "topmostSubform[0].Page1[0].c1_1[0]",  on = "1" }
presidential_spouse        = { field = "topmostSubform[0].Page1[0].c1_2[0]",  on = "1" }
claimed_dependent_taxpayer = { field = "topmostSubform[0].Page1[0].c1_6[0]",  on = "1" }
claimed_dependent_spouse   = { field = "topmostSubform[0].Page1[0].c1_7[0]",  on = "1" }
mfs_spouse_itemizes        = { field = "topmostSubform[0].Page1[0].c1_8[0]",  on = "1" }
taxpayer_aged              = { field = "topmostSubform[0].Page1[0].c1_9[0]",  on = "1" }
taxpayer_blind             = { field = "topmostSubform[0].Page1[0].c1_10[0]", on = "1" }
spouse_aged                = { field = "topmostSubform[0].Page1[0].c1_11[0]", on = "1" }
spouse_blind               = { field = "topmostSubform[0].Page1[0].c1_12[0]", on = "1" }
more_than_four_dependents  = { field = "topmostSubform[0].Page1[0].Dependents_ReadOrder[0].c1_13[0]", on = "1" }

# The four dependents rows. `name` is ONE widget spanning the printed "(1) First name / Last name"
# columns (93.6→265.6) — the form has a single cell there. The ctc/odc boxes are mapped but NEVER
# checked: v1 omits CTC/ODC (L19 = 0), and a ticked credit box beside a zero credit contradicts itself.
[[header.dependent_rows]]
name         = "topmostSubform[0].Page1[0].Table_Dependents[0].Row1[0].f1_20[0]"
ssn          = "topmostSubform[0].Page1[0].Table_Dependents[0].Row1[0].f1_21[0]"
relationship = "topmostSubform[0].Page1[0].Table_Dependents[0].Row1[0].f1_22[0]"
ctc          = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row1[0].c1_14[0]", on = "1" }
odc          = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row1[0].c1_15[0]", on = "1" }

[[header.dependent_rows]]
name         = "topmostSubform[0].Page1[0].Table_Dependents[0].Row2[0].f1_23[0]"
ssn          = "topmostSubform[0].Page1[0].Table_Dependents[0].Row2[0].f1_24[0]"
relationship = "topmostSubform[0].Page1[0].Table_Dependents[0].Row2[0].f1_25[0]"
ctc          = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row2[0].c1_16[0]", on = "1" }
odc          = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row2[0].c1_17[0]", on = "1" }

[[header.dependent_rows]]
name         = "topmostSubform[0].Page1[0].Table_Dependents[0].Row3[0].f1_26[0]"
ssn          = "topmostSubform[0].Page1[0].Table_Dependents[0].Row3[0].f1_27[0]"
relationship = "topmostSubform[0].Page1[0].Table_Dependents[0].Row3[0].f1_28[0]"
ctc          = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row3[0].c1_18[0]", on = "1" }
odc          = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row3[0].c1_19[0]", on = "1" }

[[header.dependent_rows]]
name         = "topmostSubform[0].Page1[0].Table_Dependents[0].Row4[0].f1_29[0]"
ssn          = "topmostSubform[0].Page1[0].Table_Dependents[0].Row4[0].f1_30[0]"
relationship = "topmostSubform[0].Page1[0].Table_Dependents[0].Row4[0].f1_31[0]"
ctc          = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row4[0].c1_20[0]", on = "1" }
odc          = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row4[0].c1_21[0]", on = "1" }

# ── §G-13 FIELD-PROVENANCE CENSUS ────────────────────────────────────────────────────────────────
# Every AcroForm field on this PDF the map above does not fill, with the decision that leaves it blank.
# `unmodeled` = btctax models no input that could reach the line; `artifact` = not an entry the filer
# makes; `gap` = the line IS reachable and nothing populates it (a defect).
#
# ★ This form is where the census's own module doc points for its motivating example — the comment at
#   line 122 above, recording in PROSE that the spouse's IP PIN cell "exists (f2_36) but ReturnInputs
#   does not capture one, so it is left BLANK, never guessed". Censusing it makes that record checkable.
#
# ★★ DIRECTION — lines 1b through 1h are INCOME. Unlike Schedule 3's credits, a wrongly-blank income
#    line UNDERSTATES. None of these income streams is modelled at all, so no value could have been
#    carried; that is a product scope boundary (btctax emits a BTC return), recorded plainly rather
#    than described as conservative. The two adjacent to modelled behaviour, 1c and 1g, are called out
#    individually below.
[census]

# ── Header: the fiscal-year row ──────────────────────────────────────────────────────────────────
# "For the year Jan. 1–Dec. 31, 2024, or other tax year beginning ___, 2024, ending ___, 20__".
# btctax is calendar-year throughout: `tax_year` is a single i32 and every table, bracket and
# threshold is keyed to it. A fiscal-year filer is not expressible, so the printed default stands.
"topmostSubform[0].Page1[0].f1_01[0]" = { line = "FY begin", rule = "unmodeled", reason = "Fiscal-year beginning date — btctax models calendar-year returns only (tax_year is a single i32)." }
"topmostSubform[0].Page1[0].f1_02[0]" = { line = "FY end",   rule = "unmodeled", reason = "Fiscal-year ending date — same." }
"topmostSubform[0].Page1[0].f1_03[0]" = { line = "FY end yr", rule = "unmodeled", reason = "The two-digit year of the fiscal-year end (/MaxLen 2) — same." }

# ── Header: the foreign-address row ──────────────────────────────────────────────────────────────
"topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_15[0]" = { line = "foreign country",  rule = "unmodeled", reason = "Foreign country name — btctax models a domestic filer address (street/city/state/ZIP are mapped above)." }
"topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_16[0]" = { line = "foreign province", rule = "unmodeled", reason = "Foreign province/state/county — same." }
"topmostSubform[0].Page1[0].Address_ReadOrder[0].f1_17[0]" = { line = "foreign postcode", rule = "unmodeled", reason = "Foreign postal code — same." }

# ── Filing status: the nonresident-alien-spouse election ─────────────────────────────────────────
# "If treating a nonresident alien or dual-status alien spouse as a U.S. resident for the entire tax
# year, check the box and enter their name." This is the §6013(g)/(h) election — the SAME election
# censused as unmodeled on Form 8960 (its Part I checkboxes). btctax offers no such election, so the
# box stays unchecked and the name cell empty. (f1_18 at y=534, the MFS/HOH/QSS name, IS mapped.)
"topmostSubform[0].Page1[0].c1_4[0]"  = { line = "NRA spouse box",  rule = "unmodeled", reason = "§6013(g)/(h) election to treat a nonresident-alien spouse as a U.S. resident — btctax offers no such election (consistent with the Form 8960 Part I census)." }
"topmostSubform[0].Page1[0].f1_19[0]" = { line = "NRA spouse name", rule = "unmodeled", reason = "The name of that spouse — same election, never made." }

# ── Lines 1b-1i: earned income btctax cannot see ─────────────────────────────────────────────────
"topmostSubform[0].Page1[0].f1_33[0]" = { line = "1b", rule = "unmodeled", reason = "Household employee wages not reported on Form(s) W-2 — btctax models no household employment (matching Schedule 2 line 9, Schedule H)." }
"topmostSubform[0].Page1[0].f1_34[0]" = { line = "1c", rule = "unmodeled", reason = "Tip income not reported on line 1a. ★ This is the line Schedule 2 line 5's census flags forward: btctax collects W-2 box 7 (tips already reported to the employer) and refuses on box 8 (allocated tips), but never asks whether the filer received tips withheld from the employer. Such tips are absent from the W-2 by definition, so no import can supply them — the income is outside what btctax can see, in the understatement direction." }
"topmostSubform[0].Page1[0].f1_35[0]" = { line = "1d", rule = "unmodeled", reason = "Medicaid waiver payments not reported on Form(s) W-2 (Notice 2014-7) — not modelled." }
"topmostSubform[0].Page1[0].f1_36[0]" = { line = "1e", rule = "unmodeled", reason = "Taxable dependent care benefits from Form 2441 line 26 — W-2 box 10 dependent-care benefits REFUSE the return outright (RefuseReason::DependentCareBenefit), so this line is fail-closed rather than silently blank." }
"topmostSubform[0].Page1[0].f1_37[0]" = { line = "1f", rule = "unmodeled", reason = "Employer-provided adoption benefits from Form 8839 line 29 — not modelled (and would arrive as W-2 box 12 code T, which the INERT_BOX12_CODES allowlist refuses)." }
"topmostSubform[0].Page1[0].f1_38[0]" = { line = "1g", rule = "unmodeled", reason = "Wages from Form 8919 line 6 — the worker-misclassification case. ★ Same reasoning as Schedule 2 line 6: such income reaches btctax as self-employment income and pays both halves via Schedule SE, so not filing Form 8919 overstates rather than understates." }
"topmostSubform[0].Page1[0].f1_39[0]" = { line = "1h", rule = "unmodeled", reason = "Other earned income — a catch-all with no structured source; btctax asserts no unnamed income." }
"topmostSubform[0].Page1[0].f1_40[0]" = { line = "1i", rule = "unmodeled", reason = "Nontaxable combat pay election — btctax models no combat pay and offers no election. ★ Note this cell sits in the MID column, not the amount column: line 1i feeds the EIC/IRA computations rather than the line 1z sum." }

# ── Lines 4a-6c: retirement and Social Security income ───────────────────────────────────────────
"topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_46[0]" = { line = "4a", rule = "unmodeled", reason = "IRA distributions (gross) — btctax models no IRA, matching Schedule 2 line 8 (Form 5329)." }
"topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_47[0]" = { line = "4b", rule = "unmodeled", reason = "IRA distributions, taxable amount — same." }
"topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_48[0]" = { line = "5a", rule = "unmodeled", reason = "Pensions and annuities (gross) — not modelled (matching Form 8960 line 3)." }
"topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_49[0]" = { line = "5b", rule = "unmodeled", reason = "Pensions and annuities, taxable amount — same." }
"topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_50[0]" = { line = "6a", rule = "unmodeled", reason = "Social security benefits (gross) — btctax collects no SSA-1099 and runs no §86 provisional-income worksheet." }
"topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].f1_51[0]" = { line = "6b", rule = "unmodeled", reason = "Social security benefits, taxable amount — same." }
"topmostSubform[0].Page1[0].Line4a-11_ReadOrder[0].c1_22[0]" = { line = "6c", rule = "unmodeled", reason = "The §86(e) lump-sum election checkbox — dead with lines 6a/6b blank." }

# ── Line 7's \"if not required\" checkbox ──────────────────────────────────────────────────────────

# ── Page 2, line 16: the alternative-tax-computation checkboxes ──────────────────────────────────
"topmostSubform[0].Page2[0].c2_1[0]" = { line = "16 box 1", rule = "unmodeled", reason = "Form 8814 (parent's election to report a child's interest and dividends) — btctax models no child's income." }
"topmostSubform[0].Page2[0].c2_2[0]" = { line = "16 box 2", rule = "unmodeled", reason = "Form 4972 (tax on lump-sum distributions) — no qualified plan distributions modelled." }
"topmostSubform[0].Page2[0].c2_3[0]" = { line = "16 box 3", rule = "unmodeled", reason = "The write-in third box — btctax's line 16 comes from the ordinary tax computation with no alternative form." }
"topmostSubform[0].Page2[0].f2_01[0]" = { line = "16 box 3 form", rule = "unmodeled", reason = "The form number for that write-in — same." }

# ── Page 2, lines 27-30: refundable credits ──────────────────────────────────────────────────────
"topmostSubform[0].Page2[0].f2_16[0]" = { line = "27", rule = "unmodeled", reason = "Earned income credit (EIC) — btctax computes no EIC; a forgone refundable credit can only overstate the tax." }
"topmostSubform[0].Page2[0].f2_17[0]" = { line = "28", rule = "unmodeled", reason = "Additional child tax credit from Schedule 8812 — btctax emits no Schedule 8812 (line 19 above is likewise unmapped-by-absence of that schedule)." }
"topmostSubform[0].Page2[0].f2_18[0]" = { line = "29", rule = "unmodeled", reason = "American opportunity credit from Form 8863 line 8 — no education expenses collected (matching Schedule 3 line 3)." }
"topmostSubform[0].Page2[0].f2_19[0]" = { line = "30", rule = "artifact", reason = "\"Reserved for future use.\" A printed cell that takes no entry from anyone — the second such on the return after Schedule 3 line 6e." }

# ── Page 2, lines 35a-36: how the refund is delivered ────────────────────────────────────────────
# ★ btctax fills the refund AMOUNT (line 35a, f2_24) and deliberately declares no direct-deposit
#   cells. Routing and account numbers are high-value financial PII that the return does not need in
#   order to be correct — a filer who wants direct deposit writes them on the printed form. This is a
#   positive privacy decision consistent with the vault posture, not an unfinished feature.
"topmostSubform[0].Page2[0].c2_4[0]"                  = { line = "35a Form 8888", rule = "unmodeled", reason = "\"If Form 8888 is attached, check here\" — btctax splits no refund across accounts and emits no Form 8888." }
