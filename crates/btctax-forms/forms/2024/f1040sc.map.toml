# Schedule C (Profit or Loss From Business), Form 1040, TY2024 — the crypto trade or business.
#
# Extracted with `xtask dump-fields` and correlated against the printed form's RIGHT-EDGE line markers
# (the little number printed immediately left of each amount box), located with `pdftotext -bbox-layout`.
# That distinction is load-bearing — see the line-31 trap below.
#
# ⚠️ THE MONEY COLUMN IS x ≈ [475, 576] — NOT the [504, 576] used by Schedules 1/2/3/A, Schedule SE,
# and Forms 8959/8960/8995, and not Schedule B's [489.6, 576] either. Every form in this crate that
# has an amount column puts it somewhere slightly different; none of them may share a constant.
#
# ★ THE LINE-31 TRAP. Line 31 ("Net profit or (loss)") spans THREE printed rows — the label, then two
#   bullet rows ("If a profit, enter on both Schedule 1 line 3, and on Schedule SE, line 2…"). Its
#   GUTTER label sits at y ≈ 144.5, but its AMOUNT BOX is at y ≈ 120.5, two rows lower. Correlating on
#   the gutter label would map line 31 to the wrong widget — and line 31 is the figure that feeds BOTH
#   Schedule 1 line 3 AND Schedule SE line 2, so a mis-map there is wrong income and wrong SE tax.
#   Line 30 has the same shape (label y ≈ 202.5, box y ≈ 156.5). Correlate on the RIGHT-EDGE marker.
#
#   verified right-edge marker → field:
#     line 1  y≈516.5 → f1_10      line 28 y≈228.5 → f1_41
#     line 3  y≈492.5 → f1_12      line 29 y≈216.5 → f1_42
#     line 5  y≈468.5 → f1_14      line 30 y≈156.5 → f1_45   (unmapped — see below)
#     line 7  y≈444.5 → f1_16      line 31 y≈120.5 → f1_46
#
# UNMAPPED ON PURPOSE — BLANK, never a misleading 0:
#   line 2  (f1_11)   returns and allowances
#   line 4  (f1_13)   cost of goods sold + all of Part III — mining/staking has no inventory
#   line 6  (f1_15)   other income
#   lines 8-27b       Part II's individual expense lines. v1 takes a FLAT expense total from the
#                     filer, so only the line-28 total is printed. Writing 0 into each of the twenty
#                     expense lines would assert we found no advertising, no insurance, no legal
#                     fees — a different claim from "the filer gave us one number".
#   line 30 (f1_45)   the §280A business-use-of-home deduction — out of scope
#   lines 32a/32b     the at-risk checkboxes: a Schedule C LOSS is REFUSED upstream (§465 at-risk
#                     substantiation is out of scope), so line 31 is always ≥ 0 and they never apply.
#   Part IV           vehicle information
form = "f1040sc"
year = 2024

# ── Lines A / B / F (P6.3a Q7) — captured expressly for these cells and printed by no one until now.
#    Line F's group is (1) Cash / (2) Accrual / (3) Other, left→right at y=601; v1 captures only the
#    first two, so "Other" is never checked. Line B is a 6-character comb (/MaxLen 6).
line_a_business = "topmostSubform[0].Page1[0].f1_3[0]"
line_b_naics    = "topmostSubform[0].Page1[0].BComb[0].f1_4[0]"
method_cash     = { field = "topmostSubform[0].Page1[0].c1_1[0]", on = "1" }
method_accrual  = { field = "topmostSubform[0].Page1[0].c1_1[1]", on = "2" }

line1  = "topmostSubform[0].Page1[0].f1_10[0]"   # "Gross receipts or sales"
line3  = "topmostSubform[0].Page1[0].f1_12[0]"   # "Subtract line 2 from line 1"
line5  = "topmostSubform[0].Page1[0].f1_14[0]"   # "Gross profit. Subtract line 4 from line 3"
line7  = "topmostSubform[0].Page1[0].f1_16[0]"   # "Gross income. Add lines 5 and 6"
line28 = "topmostSubform[0].Page1[0].f1_41[0]"   # "Total expenses… Add lines 8 through 27b"
line29 = "topmostSubform[0].Page1[0].f1_42[0]"   # "Tentative profit or (loss). Subtract line 28 from line 7"
line31 = "topmostSubform[0].Page1[0].f1_46[0]"   # "Net profit or (loss)…" → Schedule 1 L3 AND Schedule SE L2

# ── Identity header (P6.2). Dumped + correlated against the printed form; the SSN cell declares
#    /MaxLen 11, so it takes the HYPHENATED form (the 1040's own SSN cells are /MaxLen 9 and take
#    bare digits — the forms genuinely differ, so `push_identity` reads each cell's capacity).
# Schedule C's header is "Name of PROPRIETOR" — the business OWNER, who on a joint return may be
# the SPOUSE. Core decides that (packet::ReturnHeader.proprietor); the filler only transcribes.
[identity]
name = "topmostSubform[0].Page1[0].f1_1[0]"
ssn  = "topmostSubform[0].Page1[0].f1_2[0]"

# ── §G-13 FIELD-PROVENANCE CENSUS ────────────────────────────────────────────────────────────────
# Every AcroForm field on this PDF the map above does not fill, with the decision that leaves it blank.
# `unmodeled` = btctax models no input that could reach the line; `artifact` = not an entry the filer
# makes; `gap` = the line IS reachable and nothing populates it (a defect).
#
# ★★★ THE AGGREGATE-EXPENSE PROBLEM — read this before the entries. `ScheduleCInputs` carries a single
#     `expenses: Usd` with NO category breakdown. So btctax writes line 28 ("Total expenses… Add lines
#     8 through 27b") while every one of lines 8 through 27b is blank: the filed form shows a total
#     whose addends are all empty, which is the one place on this return where a mapped line and its
#     censused inputs do not cross-foot. Contrast Schedule 3 line 7 and Schedule 2 line 18, which are
#     blank BECAUSE their addends are.
#
#     Two consequences follow mechanically and are not otherwise visible:
#       - Line 9 (car and truck expenses) stays blank even when the aggregate includes them, so
#         Part IV — which the form gates on "claiming car or truck expenses on line 9" — is never
#         triggered, and lines 43-47b go unasked.
#       - Line 24b (deductible meals) is §274(n)-limited to 50%. A single aggregate offers the filer
#         no place to apply that limit and no prompt that it exists.
#     Each individual cell below is honestly accounted for ("no category breakdown is collected"),
#     which is why they are `unmodeled` and not `gap` — but the design weakness is recorded here
#     rather than left implicit across twenty near-identical reasons.
#
# ★★ THREE GAPS on this form (6 fields) — lines G, I and J, all Yes/No declarations asked of EVERY
#    Schedule C filer that btctax never asks. Line G's is the one with a tax effect; see below.
[census]

# ── Header lines C, D, E, F(3) ───────────────────────────────────────────────────────────────────
# btctax maps line A (principal business), line B (NAICS) and line F's Cash/Accrual pair. The rest is
# optional identification a sole proprietor may leave blank: the form itself says of line C "If no
# separate business name, leave blank."
"topmostSubform[0].Page1[0].f1_5[0]"          = { line = "C", rule = "unmodeled", reason = "Business name — ScheduleCInputs carries a business_description (line A) but no separate trade name. The form directs a filer with no separate business name to leave this blank." }
"topmostSubform[0].Page1[0].DComb[0].f1_6[0]" = { line = "D", rule = "unmodeled", reason = "Employer ID number (/MaxLen 9, a comb) — btctax collects no EIN for the proprietorship; a sole proprietor without employees files under their SSN." }
"topmostSubform[0].Page1[0].f1_7[0]"          = { line = "E street", rule = "unmodeled", reason = "Business address — not collected; ScheduleCInputs carries owner, description, NAICS, accounting method and expenses only." }
"topmostSubform[0].Page1[0].f1_8[0]"          = { line = "E city",   rule = "unmodeled", reason = "Business city, state and ZIP — same." }
"topmostSubform[0].Page1[0].c1_1[2]"          = { line = "F(3)",     rule = "unmodeled", reason = "Accounting method \"Other (specify)\" — AccountingMethod is a two-variant enum (Cash/Accrual), both mapped above, so the third box is unreachable by construction." }
"topmostSubform[0].Page1[0].f1_9[0]"          = { line = "F(3) text", rule = "unmodeled", reason = "The write-in naming that other method — same." }

# ── ★★★ GAP — line G, material participation ────────────────────────────────────────────────────
# "Did you 'materially participate' in the operation of this business during 2024? If 'No,' see
# instructions for limit on losses."
#
# btctax never asks, and the answer changes the TAX — not only the loss limit the line's own caption
# mentions. Adjudicated against the primary sources rather than inferred:
#
#   - Form 8960 (2024) line 4a reads "Rental real estate, royalties, partnerships, S corporations,
#     trusts, TRADES OR BUSINESSES, etc."
#   - i8960, What's New, verbatim: "Trade or business income subject to net investment income tax
#     (NIIT). Line 4a of Form 8960 was amended to bring attention to certain income reported on
#     Schedule C (Form 1040) and Schedule E (Form 1040) that is subject to NIIT. This change was made
#     … to better reflect section 1411(c)(2)."
#   - i8960, Passive activities: "A passive activity includes any trade or business in which you don't
#     materially participate."
#
# So a sole proprietor who does NOT materially participate has passive business income that IS §1411
# net investment income. btctax's NII is `taxable_interest + ordinary_dividends + net_capital_gain +
# crypto_lending_interest` (other_taxes.rs:232) — Schedule C income never enters it, and Form 8960
# line 4a is left blank. That is correct ONLY under the answer btctax never obtained.
#
# ★★ DIRECTION: UNDERSTATEMENT. The NIIT on that income is simply not computed. Close by adding a
#    material-participation QuestionId and routing a "No" into Form 8960 line 4a.
"topmostSubform[0].Page1[0].c1_2[0]" = { line = "G Yes", rule = "gap", reason = "\"Did you materially participate in the operation of this business during 2024?\" — never asked. A No makes the business passive under §469, so its income is §1411 NII (i8960: line 4a was amended to bring attention to Schedule C income subject to NIIT). btctax excludes Schedule C income from NII unconditionally, understating the NIIT." }
"topmostSubform[0].Page1[0].c1_2[1]" = { line = "G No",  rule = "gap", reason = "The No half of the same unasked question — and the half that would change the tax." }

# ── Line H ──────────────────────────────────────────────────────────────────────────────────────
"topmostSubform[0].Page1[0].c1_3[0]" = { line = "H", rule = "unmodeled", reason = "\"If you started or acquired this business during 2024, check here\" — btctax collects no business start date. Informational: it flags a first-year business for the IRS and changes no figure on the return." }

# ── ★★ GAP — lines I and J, the Form 1099 filing declarations ────────────────────────────────────
# "I  Did you make any payments in 2024 that would require you to file Form(s) 1099?"
# "J  If 'Yes,' did you or will you file required Form(s) 1099?"
#
# Asked of EVERY Schedule C filer, never asked by btctax, so both print blank and read as "No". This
# is the same class as the Schedule B 7a FBAR pair already recorded as a gap: no figure on THIS return
# changes, but the declaration carries its own exposure — §6721/§6722 penalties for failing to file
# and furnish information returns. A business that paid $600+ to a contractor answers Yes to both.
#
# ★ Note the interaction with the aggregate-expense problem above: line 11 (contract labor) is exactly
#   the expense that triggers a 1099-NEC, and it is one of the twenty category lines btctax cannot
#   populate — so nothing in the return even hints the question applies.
"topmostSubform[0].Page1[0].c1_4[0]" = { line = "I Yes", rule = "gap", reason = "\"Did you make any payments in 2024 that would require you to file Form(s) 1099?\" — never asked; a compliance declaration with §6721/§6722 exposure, the same class as the Schedule B FBAR pair." }
"topmostSubform[0].Page1[0].c1_4[1]" = { line = "I No",  rule = "gap", reason = "The No half of the same unasked question." }
"topmostSubform[0].Page1[0].c1_5[0]" = { line = "J Yes", rule = "gap", reason = "\"If 'Yes,' did you or will you file required Form(s) 1099?\" — never asked; the follow-on declaration, unanswerable while I is unanswered." }
"topmostSubform[0].Page1[0].c1_5[1]" = { line = "J No",  rule = "gap", reason = "The No half of the same unasked question." }

