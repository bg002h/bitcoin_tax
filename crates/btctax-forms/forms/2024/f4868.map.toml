# Form 4868 (Application for Automatic Extension of Time To File U.S. Individual Income Tax Return),
# tax year 2024 — logical cell → fully-qualified PDF field name.
#
# Written 2026-09-06 for spec SPEC_form_4868_1040v.md (FR-49 / strategy review S8), task T1.
# NOT ported from the 2025 map: everything below was re-derived from the TY2024 authority.
#
#   bundled PDF   crates/btctax-forms/forms/2024/f4868.pdf
#                 sha256:8d1a031a5543b70e0f017ed7bfd17f6ea91ab4f36ef2276bcdd09965e4160d4a, 531664 bytes
#                 — a byte-for-byte copy of design/forms/2024/f4868--2024.pdf, whose `.pdf.txt` note
#                 records the same hash against https://www.irs.gov/pub/irs-prior/f4868--2024.pdf
#   inventory     `cargo run -p xtask -- dump-fields design/forms/2024/f4868--2024.pdf` → 17 AcroForm
#                 fields: 15 text and 2 button (c1_1, c1_2, both on-state /1). 16 on page 1, 1 on page 3.
#   printed text  design/forms/extract/f4868--2024.txt (`pdftotext -layout`), lines 78–96 — every doc
#                 comment below is transcribed from THAT text layer, with its typographic apostrophes
#                 and quotation marks kept, never from the rendered page and never from the 2025 map.
#   instr_pages   MEASURED from the extract's form-feed page breaks: 4 form feeds ⇒ 4 pages, and
#                 instruction text is printed on ALL FOUR — page 1 above the DETACH HERE rule and
#                 pages 2–4 in full. So the range is [1, 4]. `instructions = "f4868"` because the form
#                 IS its own instructions document: the IRS publishes no i4868.
#
# ★★ TWO FQNs DIFFER FROM TY2025 AND ARE THE REASON THIS MAP IS NOT A COPY: the Part I subform is
#    spelled `Part1_ReadOrder` on the 2024 revision and `PartI_ReadOrder` on the 2025 one, and the
#    page-3 confirmation cell sits under `Col3` in 2024 and `Col4` in 2025. Every other field name and
#    widget rect is identical (diffed with `xtask dump-fields` on both PDFs). The PRINTED text differs
#    only in the tax-year numerals (2024/2025) and in where lines 8 and 9 wrap.
#
# ★ NO `attachment_sequence` KEY. Form 4868 prints no Attachment Sequence No. — grepping the committed
#   extract for `Sequence No` yields 0 hits, and the form's own page 2 says why: it is not attached to
#   the return at all.
#
# ★★ THE BOX→LINE ASSIGNMENT, and the ONE deviation from the transcription rule's naming clause.
#    Part II's lines 4–8 are bound `line4`…`line8`, in the form's own numbering, because the label
#    reader witnesses exactly those labels beside exactly those boxes (`xtask label-boxes f4868--2024`:
#    f1_11→4, f1_12→5, f1_13→6, f1_14→7, c1_1→8).
#    Part I's cells are NUMBERED on the printed page (1 = name, 2 = your SSN, 3 = spouse's SSN) and are
#    nevertheless bound BY NAME, because Part I's labels never form a candidate label column: the reader
#    joins those boxes to Part II's labels instead (f1_4 reads "5", f1_9/f1_10 read "9"). A `line1`…
#    `line3` spelling would red `every_mapped_line_lands_on_its_own_printed_label` three times per year
#    against a label the reader provably cannot see. See the 2025 map and Form4868Map for the full note.
form = "f4868"
year = 2024
# ── design r2 §4 — the ROW of the year-package table. sha256 COMPUTED from the bundled PDF with
#    sha256sum; instr_pages measured from the extract's page breaks. ──
irs_stem        = "f4868"
versioning      = "annual"
template_sha256 = "8d1a031a5543b70e0f017ed7bfd17f6ea91ab4f36ef2276bcdd09965e4160d4a"
instructions    = "f4868"
instr_pages     = [1, 4]
line_set        = "f4868/2024"

# ── Part I — Identification (printed lines 1–3 plus the address block; bound BY NAME, see above) ──
# L1 — "Your name(s) (see instructions)"
name_line      = "topmostSubform[0].Page1[0].Part1_ReadOrder[0].f1_4[0]"
# "Address (see instructions)"
address_street = "topmostSubform[0].Page1[0].Part1_ReadOrder[0].f1_5[0]"
# "City, town, or post office"
address_city   = "topmostSubform[0].Page1[0].Part1_ReadOrder[0].f1_6[0]"
# "State" (/MaxLen 2)
address_state  = "topmostSubform[0].Page1[0].Part1_ReadOrder[0].f1_7[0]"
# "ZIP code" (/MaxLen 10)
address_zip    = "topmostSubform[0].Page1[0].Part1_ReadOrder[0].f1_8[0]"
# L2 — "Your social security number" (/MaxLen 11 ⇒ hyphenated, per cells::push_identity)
taxpayer_ssn   = "topmostSubform[0].Page1[0].Part1_ReadOrder[0].f1_9[0]"
# L3 — "Spouse’s social security number" (/MaxLen 11); filled only for a joint return
spouse_ssn     = "topmostSubform[0].Page1[0].Part1_ReadOrder[0].f1_10[0]"

# ── Part II — Individual Income Tax (lines 4–8; the reader witnesses every one of these labels) ──
# L4 — "Estimate of total tax liability for 2024 .   .       $"
line4 = "topmostSubform[0].Page1[0].f1_11[0]"
# L5 — "Total 2024 payments . . . . .                ."
line5 = "topmostSubform[0].Page1[0].f1_12[0]"
# L6 — "Balance due. Subtract line 5 from line 4."
#      "See instructions . . . . . . . ."
line6 = "topmostSubform[0].Page1[0].f1_13[0]"
# L7 — "Amount you’re paying (see instructions) ."
line7 = "topmostSubform[0].Page1[0].f1_14[0]"
# L8 — "Check here if you’re “out of the country” and a U.S. citizen"
#      "or resident. See instructions . . . . . . . . ."
#      A CHECKBOX. The on-state is dumped from the PDF, not assumed: `on=["1"]`.
line8 = { field = "topmostSubform[0].Page1[0].c1_1[0]", on = "1" }

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# ★★★ THE FIELD CENSUS (§G-13). Every AcroForm field must be accounted for EXACTLY ONCE: mapped
# above (we fill it) or named here with the rule that says why we do not.
#
# 17 fields = 12 mapped + 5 censused. No field appears twice.
#
# rule = "unmodeled"  a situation outside btctax's scope. Using btctax FORGOES it, so the reason must
#                     name what is given up.
[census]
"topmostSubform[0].Page1[0].VoucherHeader[0].f1_1[0]" = { line = "header", rule = "unmodeled", reason = "Fiscal-year header — the form prints “For calendar year 2024, or other tax year beginning”, and this cell takes the fiscal year’s start month/day. btctax is calendar-year only (every YearRecord is a calendar year), so the calendar-year default the form already prints stands and the cell is left blank." }
"topmostSubform[0].Page1[0].VoucherHeader[0].f1_2[0]" = { line = "header", rule = "unmodeled", reason = "Fiscal-year header, the ending month/day of “, 2024, and ending”. Dead with the start cell blank — btctax is calendar-year only." }
"topmostSubform[0].Page1[0].VoucherHeader[0].f1_3[0]" = { line = "header", rule = "unmodeled", reason = "Fiscal-year header, the 2-digit ending year of “, 20”. Dead with the start cell blank — btctax is calendar-year only." }
"topmostSubform[0].Page1[0].c1_2[0]" = { line = "9", rule = "unmodeled", reason = "“Check here if you file Form 1040-NR and didn’t receive wages as an employee subject to U.S. income tax withholding” — btctax produces no Form 1040-NR (it emits Form 1040 only), so this box is never checked. Checking it would assert a return this build cannot file." }
"topmostSubform[0].Page3[0].Col3[0].f3_1[0]" = { line = "page 3 confirmation", rule = "unmodeled", reason = "“Enter confirmation number here:” on the instruction page — the confirmation an electronic payment returns. It is the filer’s own private record, is not part of what is mailed to the IRS, and btctax makes no electronic payment (out of scope, spec §Out of scope), so nothing can populate it." }
