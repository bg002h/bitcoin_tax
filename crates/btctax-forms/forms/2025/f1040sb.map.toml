# Schedule B (Interest and Ordinary Dividends), Form 1040, TY2025.
#
# Authority: design/forms/2025/f1040sb--2025.pdf
#   sha256 dd1ec3719954532bd219343d81385a2ada3c8e9573fc755a3893f1fbbecc63e2, 76411 bytes,
#   https://www.irs.gov/pub/irs-prior/f1040sb--2025.pdf  (the bundled PDF beside this file is a
#   byte-identical copy of that archived authority — verified by sha256, not by eye).
# Text layer: design/forms/extract/f1040sb--2025.txt  (face reads "Schedule B (Form 1040) 2025").
# Field names below are `xtask dump-fields` output on the 2025 PDF, not carried over from TY2024.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# ★★ THE ONE TY2024→TY2025 DELTA — the Part III line-7a checkbox pair moved one subform DEEPER.
#
#   TY2024:  topmostSubform[0].Page1[0].c1_1[0]  /  c1_1[1]
#   TY2025:  topmostSubform[0].Page1[0].TagcorrectingSubform[0].c1_1[0]  /  c1_1[1]
#
#   Nothing else changed. `dump-fields` on both years is identical apart from those two lines:
#   72 fields in each year, same names, same /Rect to the tenth of a point, same on-states. c1_2
#   (the FBAR sub-question) and c1_3 (line 8) did NOT move — only 7a's pair is wrapped, so the
#   three pairs no longer share a parent and a name generated by analogy from a sibling is wrong.
#   This is exactly the case the TY2024 header warned about for the two payer tables, one year on:
#   a TY2024 map copied forward parses, looks right, and silently writes 7a nowhere.
#
#   The printed FORM is unchanged: `diff` of the 2024 and 2025 text layers is year stamps only
#   (2024→2025 on the face, in 7a's "At any time during …" and in 8's "During …"), a new
#   "Created 4/23/25" stamp in the 2025 footer, and pdftotext column reflow — no line was added,
#   removed, renumbered or reworded. Same line numbers 1–8, same cross-references to Form 1040
#   lines 2b and 3b — the TY2025 Form 1040 renumbering of lines 11/12 does not reach this
#   schedule, which cites neither.
# ────────────────────────────────────────────────────────────────────────────────────────────────
#
# ⚠️ THE AMOUNT COLUMN IS x ≈ [489.6, 576] — NOT the [504, 576] of Schedules 1/2/3/A, Schedule SE and
# Forms 8959/8960/8995, and not Schedule C's [475, 576]. A shared amount-column constant would REJECT
# EVERY Schedule B cell. No two forms in this crate agree; none may share one.
#
# ⚠️ SUFFIXES ARE ZERO-PADDED through f1_09 (`f1_03`, not `f1_3`) — unlike Schedule A / 8960 / 8995.
#
# ★ ROW 1 OF **BOTH** REPEATING TABLES HAS A DIFFERENT PARENT SUBFORM:
#     Part I  row 1 payer: topmostSubform[0].Page1[0].Line1_ReadOrder[0].f1_03[0]
#     Part II row 1 payer: topmostSubform[0].Page1[0].ReadOrderControl[0].f1_34[0]
#   Their AMOUNT siblings (f1_04, f1_35) are NOT wrapped. Generating row names by string interpolation
#   produces two wrong FQNs — which is why the rows are written out in full below. Still true in 2025.
#   Part II's row-1 payer box also starts at x=201.6 (indented past the printed "5 List name of payer:"
#   label) rather than 129.6; both centers fall inside the PAYER cluster, so it needs no extra column.
#
# ★ ROW COUNTS ARE ASYMMETRIC AND THAT IS REAL: Part I has **14** rows, Part II has **15**. Part I's
#   label consumes three printed lines before its table starts; Part II's first row sits ON its label
#   line. Do not "fix" this to match. Confirmed on the 2025 PDF: 28 line-1 boxes (f1_03..f1_30) and
#   30 line-5 boxes (f1_34..f1_63), per `xtask label-boxes f1040sb--2025`.
#
# ★ PART III YES/NO PAIRS all share the SAME on-states (Yes = "1", No = "2") and the same x geometry,
#   so the on-state cannot disambiguate them — only the field name + y can. On-states re-dumped from
#   the 2025 PDF, not assumed from 2024:
#     c1_1 (y≈133) = line 7a   (a financial interest in a foreign account)   [now under TagcorrectingSubform]
#     c1_2 (y≈97)  = the UNNUMBERED FBAR sub-question under 7a  — ASKED and PRINTED (live iff 7a=Yes)
#     c1_3 (y≈37)  = line 8    (a distribution from a foreign trust)
#   NOTE line 7b is NOT a Yes/No pair — it is the FREE-TEXT foreign-country list (f1_65/f1_66).
#
# THE EXPECTED LINE SET, ENUMERATED FROM THE EXTRACTED TEXT (not from a range or a hand list).
# `xtask label-census f1040sb--2025` reads design/forms/extract/f1040sb--2025.txt and reports
#   9 labels, 72 boxes, 0 labels without a box:  1  2  3  4  5  6  7a  7b  8
# Every one of those nine is either mapped below or carries a [census] reason:
#   1 → part1_rows · 2 → line2 · 3 → CENSUSED (Form 8815) · 4 → line4 · 5 → part2_rows ·
#   6 → line6 · 7a → line7a (+ the unnumbered FBAR sub-question, line7a_fbar) ·
#   7b → line7b_countries (first list line; the second is CENSUSED) · 8 → line8.
# The identity header (name, SSN) prints no line number and is reported by the census as "?" — it is
# mapped under [identity].
#
# UNMAPPED ON PURPOSE (full reasons in [census] at the foot of this file):
#   line 3 (f1_32)          Form 8815 excludable savings-bond interest — no v1 input
#   f1_66 (7b, 2nd line)    the foreign-country list's continuation line
#
# ⚠️ TOML ORDERING: every ROOT scalar (form, year, line2, line4, line6) must appear BEFORE the first
# [[part1_rows]] / [[part2_rows]] array-of-tables. After an array-of-tables opens, a bare `key = ...`
# binds to the LAST table in that array, not to the root — so a `line2` placed after the row list
# would silently become a field of Part I's 14th row, and the map would fail to parse.

form = "f1040sb"
year = 2025

# ── L7b (P6.3a Q7) — the foreign-country list. It IS a captured input; the code comment claiming
#    otherwise was false. Printed only when 7a is "Yes" — a country beside a "No" contradicts the answer.
#    Form text: "If you are required to file FinCEN Form 114, list the name(s) of the foreign
#    country(-ies) where the financial account(s) is (are) located:"
line7b_countries = "topmostSubform[0].Page1[0].f1_65[0]"

# ── Root totals (must precede the row tables — see the TOML note above) ─────────────────────
line2 = "topmostSubform[0].Page1[0].f1_31[0]"   # "Add the amounts on line 1"
line4 = "topmostSubform[0].Page1[0].f1_33[0]"   # "Subtract line 3 from line 2. Enter the result here and on Form 1040 or 1040-SR, line 2b"
line6 = "topmostSubform[0].Page1[0].f1_64[0]"   # "Add the amounts on line 5. Enter the total here and on Form 1040 or 1040-SR, line 3b"

# ── Part III — Foreign Accounts and Trusts (the filer's OWN answers, transcribed) ────────────
# 7a — "At any time during 2025, did you have a financial interest in or signature authority over a
#      financial account (such as a bank account, securities account, or brokerage account) located
#      in a foreign country? See instructions"
# ★★ TY2025 ONLY: this pair — and ONLY this pair — sits under TagcorrectingSubform[0].
[line7a]
yes = { field = "topmostSubform[0].Page1[0].TagcorrectingSubform[0].c1_1[0]", on = "1" }
no  = { field = "topmostSubform[0].Page1[0].TagcorrectingSubform[0].c1_1[1]", on = "2" }
# ★ 7a's UNNUMBERED sub-question — "If 'Yes,' are you required to file FinCEN Form 114, Report of
#   Foreign Bank and Financial Accounts (FBAR), to report that financial interest or signature
#   authority? See FinCEN Form 114 and its instructions for filing requirements and exceptions to
#   those requirements". On-states VERIFIED by `xtask dump-fields` on the 2025 PDF, not by analogy
#   with the sibling pairs — and its parent is Page1[0] directly, NOT TagcorrectingSubform[0].
[line7a_fbar]
yes = { field = "topmostSubform[0].Page1[0].c1_2[0]", on = "1" }
no  = { field = "topmostSubform[0].Page1[0].c1_2[1]", on = "2" }
# 8 — "During 2025, did you receive a distribution from, or were you the grantor of, or transferor
#     to, a foreign trust? If 'Yes,' you may have to file Form 3520. See instructions"
[line8]
yes = { field = "topmostSubform[0].Page1[0].c1_3[0]", on = "1" }
no  = { field = "topmostSubform[0].Page1[0].c1_3[1]", on = "2" }

