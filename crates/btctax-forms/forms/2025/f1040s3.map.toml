# Schedule 3 (Additional Credits and Payments), Form 1040, TY2025 — logical line → PDF field name.
#
# Authority: design/forms/2025/f1040s3--2025.pdf (sha256:008cfd3fe3ebd086…, MANIFEST entry 35),
# copied verbatim to this directory as f1040s3.pdf — the bundled copy hashes IDENTICAL to the archive.
# Printed text read from design/forms/extract/f1040s3--2025.txt (`pdftotext -layout`), never from the
# rendered page. Field inventory from `xtask dump-fields`: 37 AcroForm fields, all on page 1.
#
# ── ★★★ THE PORT TRAP: THE FIELD SUFFIXES RENUMBERED, THE PRINTED FORM DID NOT ──────────────────────
#
# The TY2024 and TY2025 printed forms are the SAME FORM. `diff -b` over the two extracts (excluding the
# generated header) reports only the year stamp, the Created 11/17/25 footer, and two inserted blank
# lines. Every line number, every line sentence, and both 1040 cross-references (line 8 → 1040 line 20,
# line 15 → 1040 line 31 — re-checked against design/forms/extract/f1040--2025.txt, which still prints
# "Amount from Schedule 3, line 8" at 20 and "Amount from Schedule 3, line 15" at 31) are unchanged.
#
# But the AcroForm went 39 fields → 37, because BOTH write-in description areas collapsed from a pair of
# single-line cells into ONE Multiline cell (verified from the PDF's own /Ff: 8392704 = Multiline |
# DoNotScroll on the two write-in boxes, 8388608 on every other money box). Losing one field at 6z and
# one at 13z shifts every later suffix DOWN — by one after 6z, by two after 13z:
#
#   line          TY2024 field   TY2025 field   shift
#   1                  f1_03          f1_03       0     ── identity + lines 1..6m are UNCHANGED
#   6z type      f1_22 + f2_23        f2_22      pair → one Multiline cell
#   6z amount          f1_24          f1_23      -1
#   7                  f1_25          f1_24      -1
#   8                  f1_26          f1_25      -1
#   9                  f1_27          f1_26      -1
#   10                 f1_28          f1_27      -1
#   11                 f1_29          f1_28      -1
#   12                 f1_30          f1_29      -1
#   13a                f1_31          f1_30      -1
#   13b                f1_32          f1_31      -1
#   13c                f1_33          f1_32      -1
#   13d                f1_34          f1_33      -1
#   13z type     f1_35 + f1_36        f1_34      pair → one Multiline cell
#   13z amount         f1_37          f1_35      -2
#   14                 f1_38          f1_36      -2
#   15                 f1_39          f1_37      -2
#
# ★★ A copy of the TY2024 map would therefore LOOK right and BE wrong, silently, on 4 of its 5 mapped
#    lines. Concretely: line 8 (total nonrefundable credits) would land in the box printed
#    "9 Net premium tax credit. Attach Form 8962" — fabricated testimony to a credit with no Form 8962
#    behind it; line 10 would land on 11, line 11 on 12; and line 15 would name f1_39, which does not
#    exist in this PDF at all, so the payments total never reaches the page and the filer is billed for
#    money already paid. This is the exact reason the field names below were dumped, not ported.
#
# ── Structure, all re-measured on the TY2025 PDF ────────────────────────────────────────────────────
#
# ROOT SUBFORM IS `topmostSubform[0]` — unchanged from TY2024, and still NOT the `form1[0]` Schedules 1
# and 2 use. Schedule A's TY2025 root DID change, so this is checked per form, never assumed.
#
# ★ The `f2_` prefix trap SURVIVES, renumbered: the 6z description cell is `f2_22[0]` and sits on PAGE 1
#   between `f1_21` and `f1_23`. (TY2024's was `f2_23`.) There is no `f1_22` anywhere in the document.
#   Any page heuristic keyed on the LEAF prefix disagrees with the `PageN[0]` subform segment, which
#   correctly says Page1. Boxes are enumerated from the AcroForm walk, never from name arithmetic.
#
# ★ Line 6e (`f1_13`) is "Reserved for future use" — still a LIVE, ReadOnly widget (/Ff 8388609, the
#   only ReadOnly field on the form; every other money box is 8388608). It CONSUMES a suffix number
#   (f1_12 = 6d, f1_13 = 6e reserved, f1_14 = 6f), so anything that walks suffixes and "skips reserved
#   lines" misaligns 6f–6m by one. Never write to it.
#
# Column x-clusters, measured from `dump-fields` on this PDF: MID x = [410.4, 481.6], AMOUNT x =
# [504.0, 576.0], write-in description x = [64.8, 381.6]. Identical to TY2024.
#
# ── The expected LINE SET, enumerated from the form's own text layer ────────────────────────────────
# Read off the RIGHT-ALIGNED margin label column of design/forms/extract/f1040s3--2025.txt (bare
# sub-letters resolved against the last numeric parent), never from a range or a hand list — 35 labels:
#
#   1 2 3 4 5a 5b 6 6a 6b 6c 6d 6e 6f 6g 6h 6i 6j 6k 6l 6m 6z 7 8 9 10 11 12 13 13a 13b 13c 13d 13z 14 15
#
# Of those, 6 and 13 are HEADINGS with no box of their own ("Other nonrefundable credits:" /
# "Other payments or refundable credits:") → 33 entry-taking lines. 6z and 13z each hold TWO cells
# (description + amount) → 35 entry CELLS, plus the 2 identity cells = the 37 fields dump-fields reports.
# Every box was joined to its label by the "last gutter label at or above the box's CENTRE" rule, run
# separately per column; both columns came out 1:1 with no label unclaimed and none claimed twice.
#
# UNMAPPED ON PURPOSE:
#   lines 2, 3, 4, 5a, 5b, 6a-6z — education (8863), dependent-care (2441), saver's (8880),
#     residential-energy (5695), adoption (8839) and the rest. Every one is a §3.4 CONSERVATIVE
#     OMISSION: v1 does not compute them, which can only OVERSTATE tax, and the report fires the
#     OtherCreditsOmitted advisory. They stay BLANK — never a misleading 0.
#   lines 9, 12, 13a-13z — net premium tax credit, fuels credit, etc.
form = "f1040s3"
year = 2025
# ── design r2 §4 — the ROW of the year-package table. Values COMPUTED 2026-09-05 (sha256 from the
#    bundled PDF; attachment sequence read off the printed form), never typed by hand. ──
irs_stem            = "f1040s3"
versioning          = "annual"
template_sha256     = "008cfd3fe3ebd0860452069b90fd0a3d53dda6dd8a5d870278370aa899a63f82"
instructions        = "i1040gi"
line_set            = "f1040s3/2025"
attachment_sequence = "03"

# ── Part I — Nonrefundable Credits ──────────────────────────────────────────────────────────────
line1  = "topmostSubform[0].Page1[0].f1_03[0]"   # L1 — "Foreign tax credit. Attach Form 1116 if required"
line8  = "topmostSubform[0].Page1[0].f1_25[0]"   # L8 — "Add lines 1 through 4, 5a, 5b, and 7. Enter here and on Form 1040, 1040-SR, or 1040-NR, line 20"

# ── Part II — Other Payments and Refundable Credits ─────────────────────────────────────────────
# The AMOUNT column runs f1_24=L7, f1_25=L8, f1_26=L9, f1_27=L10, f1_28=L11, f1_29=L12, f1_36=L14,
# f1_37=L15 — 14 boxes against the 14 amount-gutter labels the text layer prints, joined by y-centre.
line10 = "topmostSubform[0].Page1[0].f1_27[0]"   # L10 — "Amount paid with request for extension to file (see instructions)"
line11 = "topmostSubform[0].Page1[0].f1_28[0]"   # L11 — "Excess social security and tier 1 RRTA tax withheld"
line15 = "topmostSubform[0].Page1[0].f1_37[0]"   # L15 — "Add lines 9 through 12 and 14. Enter here and on Form 1040, 1040-SR, or 1040-NR, line 31"

# ── Identity header (P6.2). Dumped from THIS PDF: the SSN cell still declares /MaxLen 11, so it takes
#    the HYPHENATED form (the 1040's own SSN cells are /MaxLen 9 and take bare digits — the forms
#    genuinely differ, so `push_identity` reads each cell's capacity). f1_01 spans x 36.0-445.6 under
#    "Name(s) shown on Form 1040, 1040-SR, or 1040-NR"; f1_02 spans x 447.4-576.0 under "Your social
#    security number".
[identity]
name = "topmostSubform[0].Page1[0].f1_01[0]"
ssn  = "topmostSubform[0].Page1[0].f1_02[0]"

# ── §G-13 FIELD-PROVENANCE CENSUS ────────────────────────────────────────────────────────────────
# Every AcroForm field on this PDF the map above does not fill, with the decision that leaves it blank.
# `unmodeled` = btctax models no input that could reach the line; `artifact` = not an entry the filer
# makes; `gap` = the line IS reachable and nothing populates it (a defect). 30 entries here + 7 mapped
# FQNs above = the 37 fields dump-fields reports. No `gap` on this form.
#
# ★ DIRECTION — this whole form is CREDITS AND PAYMENTS. Every line here only ever REDUCES tax or
#   increases the refund, so each blank is a class (B) forgone benefit: lawful silence that can only
#   OVERSTATE the tax. There is no understatement risk anywhere on Schedule 3. Recording that once here
#   is why the per-line reasons below stay short.

# ★★★ R2.2 — THE `[direction]` TABLE. Each block's `caption` is asserted VERBATIM against
#     design/forms/extract/f1040s3--2025.txt at `extract_line` BEFORE the join uses it, so this table
#     is a READING of the form and a re-parted revision REDS rather than drifting. A census entry
#     is placed by its own line number into the block whose [first_line, last_line] range contains
#     it; an entry with no printed line number carries `part = "<caption>"`. An entry no block
#     places REDS — it is never defaulted to Overstates.
#
#
#     ★★★ A BLOCK STATES NO DIRECTION, and that absence is the guarantee. It records only what the
#     form PRINTS: the caption and the lines it heads. Which way a blank inside it moves the tax is
#     READ from the caption in one reviewed place — `xtask::census_join::DIRECTION_OF_CAPTION` —
#     where each reading cites the form's own total sentence (the total these lines are combined
#     into, and the line of the 1040 that total goes to) as its evidence. `DirectionBlock` carries
#     `deny_unknown_fields`, so a `direction = "..."` key here is a PARSE ERROR, not a judgement
#     nobody checked.
[[direction]]
caption      = "Part I       Nonrefundable Credits"
extract_line = 15
first_line   = "1"
last_line    = "8"

[[direction]]
caption      = "Part II      Other Payments and Refundable Credits"
extract_line = 41
first_line   = "9"
last_line    = "15"
[census]

# ── Part I lines 2–5b: nonrefundable credits from forms btctax does not emit ─────────────────────
"topmostSubform[0].Page1[0].f1_04[0]" = { line = "2",  rule = "unmodeled", reason = "Credit for child and dependent care expenses from Form 2441, line 11 — btctax collects no care expenses and emits no 2441.", covered_by = "Advisory::OtherCreditsOmitted" }
"topmostSubform[0].Page1[0].f1_05[0]" = { line = "3",  rule = "unmodeled", reason = "Education credits from Form 8863, line 19 — no education expenses collected.", covered_by = "RefuseReason::DocumentTypeUnsupported" }
"topmostSubform[0].Page1[0].f1_06[0]" = { line = "4",  rule = "unmodeled", reason = "Retirement savings contributions credit (Form 8880) — no retirement contributions collected.", covered_by = "Advisory::OtherCreditsOmitted" }
"topmostSubform[0].Page1[0].f1_07[0]" = { line = "5a", rule = "unmodeled", reason = "Residential clean energy credit from Form 5695, line 15 — not modelled.", covered_by = "Advisory::OtherCreditsOmitted" }
"topmostSubform[0].Page1[0].f1_08[0]" = { line = "5b", rule = "unmodeled", reason = "Energy efficient home improvement credit from Form 5695, line 32 — not modelled.", covered_by = "Advisory::OtherCreditsOmitted" }

# ── Line 6a–6m: the other-nonrefundable-credit menu ──────────────────────────────────────────────
"topmostSubform[0].Page1[0].Line6a_ReadOrder[0].f1_09[0]" = { line = "6a", rule = "unmodeled", reason = "General business credit (Form 3800) — not modelled.", covered_by = "Advisory::OtherCreditsOmitted" }
"topmostSubform[0].Page1[0].f1_10[0]" = { line = "6b", rule = "unmodeled", reason = "Credit for prior year minimum tax (Form 8801). ★ The one line on this form adjacent to modelled behaviour: btctax computes CURRENT-year AMT (Form 6251) and so can create the very deferral that generates this credit in a later year, but it carries no AMT credit forward and emits no 8801. Already recorded as a known-uncaptured item at btctax-core/src/tax/amt.rs. A forgone credit — it can only overstate the tax — but a real one, and it becomes a gap the moment a prior-year AMT input is collected.", covered_by = "Advisory::OtherCreditsOmitted" }
"topmostSubform[0].Page1[0].f1_11[0]" = { line = "6c", rule = "unmodeled", reason = "Adoption credit (Form 8839) — not modelled.", covered_by = "Advisory::OtherCreditsOmitted" }
"topmostSubform[0].Page1[0].f1_12[0]" = { line = "6d", rule = "unmodeled", reason = "Credit for the elderly or disabled (Schedule R) — not modelled.", covered_by = "Advisory::OtherCreditsOmitted" }
"topmostSubform[0].Page1[0].f1_13[0]" = { line = "6e", rule = "artifact",  reason = "\"Reserved for future use.\" The IRS prints a box on a line that takes no entry from anyone; there is nothing to model. Verified still ReadOnly on the TY2025 PDF (/Ff 8388609 — the only ReadOnly field on the form)." }
