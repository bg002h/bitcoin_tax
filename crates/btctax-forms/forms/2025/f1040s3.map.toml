# ── Line 6z / 13z — the free-text "list type and amount" escape hatches ───────────────────────────
# ★ These are the only WRITE-IN lines on the form. TY2025 replaced TY2024's PAIR of single-line
#   description cells with ONE Multiline cell per line (both /Ff 8392704, both 24pt tall against the
#   12pt of every money box) — so this form now has two description cells, not four. btctax never
#   writes a free-text credit onto a return. That is deliberate, not an omission: a write-in is
#   unstructured testimony the software cannot substantiate, and the product's posture is that anything
#   it cannot name and compute does not get asserted under §6065.
"topmostSubform[0].Page1[0].Line6z_ReadOrder[0].f2_22[0]" = { line = "6z type",   rule = "unmodeled", reason = "Free-text description cell for an other nonrefundable credit (Multiline; TY2024's f1_22 + f2_23 pair merged into this one box) — btctax writes no write-in credits.", covered_by = "Advisory::OtherCreditsOmitted" }
"topmostSubform[0].Page1[0].f1_23[0]"                     = { line = "6z amount", rule = "unmodeled", reason = "Amount for the 6z write-in — same decision. MID column, y-centre 402.0, joined to the printed 6z gutter label.", covered_by = "Advisory::OtherCreditsOmitted" }

# ── Derived totals whose every input is blank ────────────────────────────────────────────────────
# Lines 7 and 14 sum only lines btctax never populates, so each is a computed zero over an all-blank
# set. IRS convention leaves such a sum blank; the mapped totals (line 8, line 15) are correct without
# it because line 8 = lines 1-4 + 5a + 5b + 7 and line 7 contributes nothing.
"topmostSubform[0].Page1[0].f1_24[0]" = { line = "7",  rule = "unmodeled", reason = "\"Total other nonrefundable credits. Add lines 6a through 6z\" — dead with all of 6a-6z blank.", covered_by = "Advisory::OtherCreditsOmitted" }
"topmostSubform[0].Page1[0].f1_36[0]" = { line = "14", rule = "unmodeled", reason = "\"Total other payments or refundable credits. Add lines 13a through 13z\" — dead with all of 13a-13z blank.", covered_by = "Advisory::OtherCreditsOmitted" }

