# Form 6251 (Alternative Minimum Tax—Individuals), TY2025 — logical line → PDF field name.
#
# Extracted with `./target/debug/xtask dump-fields design/forms/2025/f6251--2025.pdf`
# (62 AcroForm fields: 2 identity + 60 numbered money boxes) and correlated against
# `design/forms/extract/f6251--2025.txt`.
#
# Template: `crates/btctax-forms/forms/2025/f6251.pdf`, byte-identical to the archived authority
# `design/forms/2025/f6251--2025.pdf`, sha256 6995bfd29c6fe1b80fdc396c9c4796c7cef58a966070db0346721eae815fea3f
# (104,434 bytes; matches `design/forms/2025/f6251--2025.pdf.txt` and the extract's own header).
#
# ★★★ THIS IS NOT THE TY2024 MAP WITH THE YEAR BUMPED. Line 1 SPLIT into 1a/1b for TY2025, so page 1
# gained one widget and EVERY page-1 field name from `f1_4` onward means a DIFFERENT LINE than it did
# in TY2024. `f1_4` was line 2a; it is now line **1b**. Porting the TY2024 assignment unchanged puts
# 2a's figure in 1b's box and shifts all of 2a..11 down one, ending with line 11 (the AMT itself, the
# figure that carries to Schedule 2 line 2) written into line 10's box and `f1_33` left blank on a
# filed return. Page 2 is untouched: `f2_1..f2_29` are identical in NAME and RECT to TY2024.
#
# ★★★ HOW THE ASSIGNMENT WAS CORROBORATED, rather than zipped in order — four independent checks:
#   1. PER-PAGE COUNTS. Page 1 carries exactly 31 money widgets (`f1_3`..`f1_33`) and Part I+II is
#      exactly 31 numbered boxes (1a, 1b, 2a-2t, 3, 4, 5-11); page 2 carries 29 and Part III is 29
#      (12-40). The label census reads 60 labels against 62 boxes — the 2 unlabelled are name + SSN.
#   2. THE INSET TRIO. Exactly three page-1 widgets are narrower than the rest — `f1_6`, `f1_10`,
#      `f1_23` at x=[508,572] (w=64) against every other money box at [504,576] (w=72). The form
#      prints exactly three PARENTHESISED boxes: 2b, 2f, 2s (extract rows 24, 28, 41). Under this
#      assignment the two sets coincide exactly, which no other offset achieves. ★ These are NOT the
#      TY2024 widgets: there the inset trio was `f1_5`/`f1_9`/`f1_22`. A 2025 conformance check that
#      keeps TY2024's hardcoded list will red on a correct map.
#   3. THE 1a INSET COLUMN. `f1_3` is the only money widget not in the right-hand amount column — it
#      sits at x=[410.4,481.6], y=[648,660]. The form prints 1a's box in the inner column (extract
#      row 19 puts "1a" well left of row 21's "1b"), because 1a is a sub-total feeding 1b. No other
#      line on this form has that geometry, so `f1_3` = 1a is pinned by position alone.
#   4. MONOTONIC y, WITH THE GAPS. Widget y descends strictly as the line number ascends on both
#      pages, and every gap larger than 12 lands on a line the extract prints across multiple rows
#      (4, 5, 6, 7, 10 on page 1; 13, 15, 18, 19, 20, 25, 26, 27, 33, 35, 39, 40 on page 2).
#   ★ Independently reproduced end-to-end by the geometric label reader:
#     `./target/debug/xtask label-boxes f6251--2025` emits exactly this field→label assignment, and
#     `label-census f6251--2025` reports "60 entry line(s), 0 without a box". Two methods, one answer.
#
# ★★ TWO SIGN CONVENTIONS ON ONE FORM, and they are not interchangeable:
#   · The three PARENTHESISED boxes (2b, 2f, 2s) have the minus printed for them, so the digits
#     written must be a POSITIVE MAGNITUDE. `Form6251::line2b` is stored NEGATIVE (i6251 line 2b:
#     "Enter the total as a negative amount"), so writing it raw renders `(-500)` — a positive number
#     on a filed form.
#   · Other lines are ALSO entered as negative amounts but print NO parentheses — those take a
#     literal minus sign. Measured from `design/forms/extract/i6251--2025.txt` by attributing each
#     "negative amount" directive to its own `Line NN—` section heading, the TY2025 set is:
#     1b, 2b, 2c, 2d, 2f, 2k, 2l, 2m, 2n, 2q, 2s, 3 — of which only 2b, 2f and 2s are parenthesised.
#     ★ The same measurement over `i6251--2024.txt` yields 2b, 2c, 2d, 2f, 2k, 2l, 2n, 2p, 2q, 2s, 3,
#       which does NOT reproduce the TY2024 map's hand-written list (that list names 2o and 2r and
#       omits 2m). The emitter's sign handling should be re-derived from this measurement rather than
#       from either prose list; only the parenthesised trio affects THIS file.
#
# ★★ THE MFS LINE-4 KICKER MOVED, and its two constants are ONE NUMBER APART FROM COLLIDING with the
# zero-exemption threshold — the §55(d)(3) coincidence that has cost this repo two oracles at once.
# i6251--2025 "Line 4—Alternative Minimum Taxable Income", verbatim: *"If your filing status is
# married filing separately and line 4 is more than $900,350, you must include an additional amount on
# line 4. If line 4 is $1,174,350 or more, include an additional $68,500. Otherwise, include 25% of
# the excess of the amount on line 4 over $900,350."* And the Exemption Worksheet's own note puts the
# MFS zero-exemption point at *"$900,350 if married filing separately"* — the SAME $900,350. TY2024's
# pair was $875,950 / $66,650. There is no widget for the kicker: it is folded into line 4's own box,
# which is why no field map can catch it being dropped.
#
# ★ SCOPE. btctax models 42 of the 60 numbered boxes. Lines 2c-2t are censused, not mapped — see the
# census at the foot of this file.

form = "f6251"
year = 2025

