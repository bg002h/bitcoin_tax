# ── Header ───────────────────────────────────────────────────────────────────────────────────────
#
# ★ LAST on purpose. TOML binds every bare key after a table header INTO that table, so an `[identity]`
#   block above the `lineNN` keys silently swallows all FORTY-TWO of them and the parse then fails with
#   "missing field `line1a`", which reads like a typo and is really a layout error.
[identity]
name = "topmostSubform[0].Page1[0].f1_1[0]"
ssn  = "topmostSubform[0].Page1[0].f1_2[0]"

# ── The census: all 62 AcroForm fields are accounted for (2 identity + 42 mapped + 18 here) ──────
#
# ★★★ Lines 2c-2t are Part I add-backs `crates/btctax-core/src/tax/form6251.rs` does not model. They
# are `gap`, NOT `unmodeled`: `unmodeled` means the filer FORGOES A BENEFIT, and every one of these is
# an ADD-BACK — the filer forgoes a LIABILITY. A filer who has one and files anyway understates tax on
# a return signed under 26 USC §6065.
#
# ★★ They are reachable only through a REFUSAL, not through a blank: the `OtherOutOfScopeIncome`
# out-of-scope declaration (`crates/btctax-core/src/tax/questions.rs`) names limb (b) "You EXERCISED
# AN INCENTIVE STOCK OPTION (ISO) and still held the stock at the end of the year — you would have a
# Form 3921" and limb (c) "any other item this tool never asked about that changes your ALTERNATIVE
# MINIMUM TAX — depletion, a tax-shelter farm activity, a passive activity, or research and
# experimental costs", and a `yes` refuses. That was necessary because an ISO exercise is NOT INCOME
# for the regular tax (i6251 line 2i's own first sentence), so the income half of that question could
# never have caught it — and because the missing add-back also suppressed `must_attach()`, the gap hid
# its own detection. See FOLLOWUPS §G-6. The declaration is year-independent, so this census carries
# from TY2024 unchanged in SUBSTANCE — only the widget names shifted by one.
#
# ★ EVERY CENSUS FIELD NAME BELOW MOVED. TY2024 censused `f1_6`..`f1_23`; TY2025 censuses
#   `f1_7`..`f1_24`, because line 1's split pushed page 1 down one widget. `f1_6` is now line 2b,
#   which is MAPPED — copying the TY2024 census would both censure a mapped box and leave `f1_24`
#   (line 2t) unaccounted for.

[census]
"topmostSubform[0].Page1[0].f1_7[0]" = { line = "2c", rule = "unmodeled", reason = "A Part I add-back `form6251.rs` does not model. It is an ADD-BACK, so silence UNDERSTATES tax — the filer is REFUSED through the OtherOutOfScopeIncome out-of-scope declaration (limb (c) names the AMT items) rather than filed with a laundered zero." }
