# ══════════════════════════════════════════════════════════════════════════════════════════════════
# FILING STATUS — ported 2026-09-21.
#
# ★★★ **THE ON-STATE ORDER IS NOT TY2024's, and copying it would tick the WRONG STATUS.** All five are
#     kids of one radio field, so the on-state is what selects; TY2024 numbers them
#     single=1 hoh=2 mfj=3 mfs=4 qss=5, and TY2025 numbers them **single=1 mfj=2 mfs=3 hoh=4 qss=5**
#     because the grouping changed from row-major to column-major. A wrong on-state here does not print
#     a wrong figure — it files under a different filing status, which changes the standard deduction,
#     every bracket and every phase-out on the return.
#
# ★★★ Each is read off the printed row, left column then right (`f1040--2025.txt:28-30`):
#       y=578  "Single"                     | "Head of household (HOH)"
#       y=566  "Married filing jointly …"   | "Qualifying surviving spouse (QSS)"
#       y=554  "Married filing separately (MFS). Enter spouse's SSN above"
#     The left column is `Checkbox_ReadOrder[0].c1_8[0..2]` (x 97.6) carrying on-states 1,2,3 top-down;
#     the right is `c1_8[0..1]` (x 349.6) carrying 4,5. Every on-state below is one the widget itself
#     declares — `every_ty2025_header_cell_…` style verification, not a transcription of TY2024's.
