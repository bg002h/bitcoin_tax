# ★★★ **T14 — Form 1040 lines 4a/4b, 5a/5b and 6a/6b, derived from the geometry (see the 2024 map).**
#
# ★★ **THIS REVISION ADDED 4c AND 5c, and they are DELIBERATELY UNMAPPED.** `f1_64` (4c) and `f1_67`
# (5c) are narrow write-in CODE boxes — 4c: "Check if … 1 Rollover · 2 QCD"; 5c: "… 1 Rollover ·
# 2 PSO" — sitting between each pair's amount row and the next line. They are not money, and every
# code they can carry names a branch this build REFUSES (a rollover, a qualified charitable
# distribution, the retired public safety officer exclusion). So leaving them blank is the CORRECT
# return, and it is recorded here rather than left as an absence.
#
# ★ TY2024 has neither box. Their existence is a per-revision structural difference of the same class
# as C-1's line 6d — which is why every name here is read off THIS edition's geometry.
line4a = "topmostSubform[0].Page1[0].f1_62[0]"
line4b = "topmostSubform[0].Page1[0].f1_63[0]"
line5a = "topmostSubform[0].Page1[0].f1_65[0]"
line5b = "topmostSubform[0].Page1[0].f1_66[0]"
line6a = "topmostSubform[0].Page1[0].f1_68[0]"
line6b = "topmostSubform[0].Page1[0].f1_69[0]"
# ★★★ **Line 6d — the MFS lived-apart DISCLOSURE checkbox.** `label_reader` joins `c1_42[0]` to label
#     `6d` (and `c1_41[0]` to `6c`); the widget declares exactly one on-state, `1`. The TY2024 form has
#     no 6d at all — that revision says to write "D" beside the word "benefits" on line 6a — so this
#     cell exists in THIS map only, and `mfs_lived_apart_disclosure` is what decides which applies.
#
# ★ Line 6c, the §86(e) lump-sum election, is deliberately UNMAPPED, like 4c and 5c: btctax does not
#   model the election, and the election is optional and can only ever lower the tax, so a filer who
#   does not make it files a correct return with that box blank. 6d is not like that — it discloses a
#   FACT btctax has already relied on.
line6d = { field = "topmostSubform[0].Page1[0].c1_42[0]", on = "1" }

da_yes = { field = "topmostSubform[0].Page1[0].c1_10[0]", on = "1" }
da_no = { field = "topmostSubform[0].Page1[0].c1_10[1]", on = "2" }

# ── T8 / R6 — THE TY2025+ DEPENDENTS GRID ────────────────────────────────────────────────────────
#
# The TY2025 form RE-PARTED this block: TY2024 prints four dependent ROWS of four columns, TY2025
# four dependent COLUMNS of seven rows — and rows (5), (6) and (7) have no TY2024 counterpart
# (f1040--2025.txt:38-54).
#
# GENERATED, NEVER TYPED. `cargo run -p xtask -- dependents-grid f1040--2025` measures every field
# name and every on-state off the form's own geometry and AcroForm dictionary, and
# `xtask::dependents_grid::tests::the_committed_ty2025_grid_map_is_the_one_measured_off_the_form`
# holds this file to that measurement. A transposed pair inside one dependent's row (6) prints
# "permanently and totally disabled" where the filer said "full-time student" — invisible on the
# emitted page, invisible to both oracles, and invisible to the field census, which asks only
# whether a NAME is accounted for and never whether it is in the right SLOT.
#
# ROWS (1)-(4) ARE DERIVED AND DELIBERATELY NOT MAPPED. They are the page-1 IDENTITY block's cells;
# this build writes no TY2025 identity block (this map has no [header], and the full-return filler
# refuses on that). A mapped cell that nothing writes is the "blank because nothing populated it"
# defect with a map entry in front of it, so they stay UNACCOUNTED on the field census's UNCENSUSED
# register — the honest home for a cell with no decision yet. Their measured names are printed by
# the generator, commented and UNQUOTED (field_census.rs text-scans quoted spans, comments
# included), so the next task does not re-derive them and the register does not shrink by cells
# nothing writes.
#   Rows (1)/(2) also carry a COLLECTION gap: the TY2025 form asks first and last name in two cells
#   and `Dependent` holds one `name` string. Splitting it at a space would invent testimony; it must
#   be collected (FOLLOWUPS FR-84).

# ════════════════════════════════════════════════════════════════════════════════════════════════
# THE MONEY LINES — transcribed 2026-09-20 (FR-260).
#
# ★★★ THE KEY IS SEMANTIC, THE COMMENT IS THE PRINTED LABEL, AND ON THIS REVISION THEY DIFFER.
#     `Form1040Map`'s fields name a QUANTITY — `line11` is documented "L11 — AGI" — while TY2025
#     RENUMBERED the form. So `line11` carries the widget printed at **11a**, `line12` the one at
#     **12e**, and `line13` the one at **13a**. Reading the key as a printed line number is the
#     mistake this block is arranged to prevent; the label is in the comment beside every cell.
#
# ★★★ Every FQN is DERIVED, never typed: `xtask label-boxes f1040--2025` joins each widget to the
#     label the form prints beside it, and the a/b pairs are split by COLUMN against
#     `form1040_full::f1040_full_clusters` — SUBLINE [252,324], MID [410,482], AMOUNT [504,576].
#     So 2a is the SUBLINE widget of the pair labelled `2a` and 2b is the AMOUNT one.
#
# ★★★ Every caption below was checked verbatim against `design/forms/extract/f1040--2025.txt`
#     BEFORE this block was written — 35/35 — and `xtask line-coverage` re-checks them on every
#     run. That gate already caught two captions I typed from memory in the identity block.
#
# ★ NOT mapped, deliberately: **11b** ("Amount from line 11a (adjusted gross income)"), the page-2
#   carry-forward TY2025 added — `Form1040Map` has no field for it because the TY2024 line set has
#   no such line. It stays in the field register rather than being pointed at a semantic cell it
#   is not. Same for **13b** ("Additional deductions from Schedule 1-A, line 38"), whose figure
#   reaches the return through `AbsoluteReturn::schedule_1a_additional`.
# 1a "Total amount from Form(s) W-2, box 1 (see instructions)"
