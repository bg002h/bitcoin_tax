# Form 1040 (2025), capital-gains cells ONLY — logical cell → fully-qualified PDF field name.
# Amount column x-cluster (hand-pinned): [504, 576] (col 0). Line 7a f1_70 = [504,90,576,102].
# Digital-Asset question is a same-y {/1,/2} /Btn pair at y≈497 (verified map-independently by the
# topmost_yes_no_pair oracle): Yes = c1_10[0] (LEFT, on-state /1); No = c1_10[1] (on-state /2).
form = "f1040"
year = 2025
# ── design r2 §4 — the ROW of the year-package table. Values COMPUTED 2026-09-05 (sha256 from the
#    bundled PDF; attachment sequence read off the printed form), never typed by hand. ──
irs_stem            = "f1040"
versioning          = "annual"
template_sha256     = "3d31c226df0d189ced80e039d01cf0f8820c1019681a0f0ca6264de277b7e982"
instructions        = "i1040gi"
line_set            = "f1040/2025"

line7a = "topmostSubform[0].Page1[0].f1_70[0]"
da_yes = { field = "topmostSubform[0].Page1[0].c1_10[0]", on = "1" }
da_no = { field = "topmostSubform[0].Page1[0].c1_10[1]", on = "2" }

# ── T8 / R6 — THE TY2025+ DEPENDENTS GRID ────────────────────────────────────────────────────────
#
# The TY2025 form RE-PARTED this block: TY2024 prints four dependent ROWS of four columns, TY2025
# four dependent COLUMNS of seven rows — and rows (5), (6) and (7) have no TY2024 counterpart
# (f1040--2025.txt:38-54).
#
# GENERATED, NEVER TYPED. `cargo run -p xtask -- dependents-grid f1040--2025` measures every field
# name and every on-state off the form's own geometry and AcroForm dictionary, and
# `xtask::dependents_grid::tests::the_committed_ty2025_grid_map_is_the_one_measured_off_the_form`
# holds this file to that measurement. A transposed pair inside one dependent's row (6) prints
# "permanently and totally disabled" where the filer said "full-time student" — invisible on the
# emitted page, invisible to both oracles, and invisible to the field census, which asks only
# whether a NAME is accounted for and never whether it is in the right SLOT.
#
# ROWS (1)-(4) ARE DERIVED AND DELIBERATELY NOT MAPPED. They are the page-1 IDENTITY block's cells;
# this build writes no TY2025 identity block (this map has no [header], and the full-return filler
# refuses on that). A mapped cell that nothing writes is the "blank because nothing populated it"
# defect with a map entry in front of it, so they stay UNACCOUNTED on the field census's UNCENSUSED
# register — the honest home for a cell with no decision yet. Their measured names are printed by
# the generator, commented and UNQUOTED (field_census.rs text-scans quoted spans, comments
# included), so the next task does not re-derive them and the register does not shrink by cells
# nothing writes.
#   Rows (1)/(2) also carry a COLLECTION gap: the TY2025 form asks first and last name in two cells
#   and `Dependent` holds one `name` string. Splitting it at a space would invent testimony; it must
#   be collected (FOLLOWUPS FR-84).

[dependents_grid]
more_than_four_dependents = { field = "topmostSubform[0].Page1[0].Dependents_ReadOrder[0].c1_11[0]", on = "1" }

# Dependent 1
[[dependents_grid.columns]]
# (derived; NOT mapped — identity block) first_name = topmostSubform[0].Page1[0].Table_Dependents[0].Row1[0].f1_31[0]
# (derived; NOT mapped — identity block) last_name = topmostSubform[0].Page1[0].Table_Dependents[0].Row2[0].f1_35[0]
# (derived; NOT mapped — identity block) ssn = topmostSubform[0].Page1[0].Table_Dependents[0].Row3[0].f1_39[0]
# (derived; NOT mapped — identity block) relationship = topmostSubform[0].Page1[0].Table_Dependents[0].Row4[0].f1_43[0]
lived_with_you = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row5[0].Dependent1[0].c1_12[0]", on = "1" }
lived_with_you_in_us = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row5[0].Dependent1[0].c1_13[0]", on = "1" }
full_time_student = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row6[0].Dependent1[0].c1_20[0]", on = "1" }
permanently_and_totally_disabled = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row6[0].Dependent1[0].c1_21[0]", on = "1" }
child_tax_credit = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row7[0].Dependent1[0].c1_28[0]", on = "1" }
credit_for_other_dependents = { field = "topmostSubform[0].Page1[0].Table_Dependents[0].Row7[0].Dependent1[0].c1_28[1]", on = "2" }

