# ══════════════════════════════════════════════════════════════════════════════════════════════════
# THE IDENTITY BLOCK — ported 2026-09-20 (FR-260).
#
# ★★★ Every cell below was resolved from the TY2025 form's OWN PRINTED CAPTION, never from the TY2024
#     numbering. The FQNs shift by +10 on page 1 and that shift is REAL — but it is not what was used,
#     because relying on it is unsafe twice over: TY2025 REUSES `c1_6`/`c1_7` for the presidential fund
#     where TY2024 spent them on claimed-dependent, and the last-name COLUMN moved 238.6 -> 253.0, which
#     is what made an earlier same-x match land `taxpayer_last` in the fiscal-year row.
#
# ★★★ **TY2025 inserted a fiscal-year row above the name block** (`f1_04`-`f1_10`, /MaxLen 2/2/4/2/2/4 —
#     two MM/DD/YYYY dates for "or other tax year beginning … ending …"). So TY2024's
#     `taxpayer_ssn = f1_06[0]` lands on a TWO-CHARACTER box here. Only the /MaxLen guard caught that;
#     the FQN exists, and existing is not the same as being the same cell.
#
# ★★★ **The standard-deduction / age-blindness block LEFT the header.** On TY2024 it is the unnumbered
#     "Standard Deduction" / "Age/Blindness" area of page 1. On TY2025 it is NUMBERED LINE 12a-12d, on
#     PAGE 2 (`f1040--2025.txt:92-94`), which is why six of these cells are `Page2` widgets.
#
# ★ Line 12c ("You were a dual-status alien"), which TY2024 folded into 12b's caption, has no cell here:
#   `dual_status_alien` REFUSES in both states (`DualStatusAlienUnsupported`), so the box is unreachable.
