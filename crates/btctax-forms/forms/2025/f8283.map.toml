# Form 8283 (Rev. 12-2025) — logical cell → fully-qualified PDF field name. Every cell pinned by its
# own /Rect (do NOT trust names alone). Parts renumbered on this revision: III Taxpayer stmt,
# IV Appraiser declaration, V Donee acknowledgment.
#
# Section A (page 1, Line 1) = 4 rows (A–D); Section B Part I (page 1, Line 3) = 3 rows (A–C).
# We FILL donee/appraiser IDENTITY + per-row property data; we leave BLANK every other party's
# declaration/signature (Part II restriction Qs, Part III taxpayer sig, Part IV appraiser sig/date,
# Part V donee acknowledgment/receipt-date/unrelated-use/authorized-sig).
form = "f8283"
year = 2025
# ── design r2 §4 — the ROW of the year-package table. Values COMPUTED 2026-09-05 (sha256 from the
#    bundled PDF; attachment sequence read off the printed form), never typed by hand. ──
irs_stem            = "f8283"
versioning          = { periodic = "Rev. 12-2025" }
template_sha256     = "389ab1b7c01b542724092f82a55dd43ab00792770b5254a87c4cd4082d8d4c69"
instructions        = "i8283"
line_set            = "f8283/2025"
attachment_sequence = "36"

