# ★★★ P3 — column (i) is NOT mapped (it was c5, [504,576]). i8283: "Complete column (i), amount
#   claimed as a deduction, if you are a pass-through entity or a member of a pass-through entity."
#   btctax models neither, so the cell is not this filer's. Same decision as the 2024 map, where the
#   three cells are recorded in that map's `[census]`. (This year has no `[census]` section yet.)
#   The FQNs, kept here so the un-mapping is legible rather than a silent absence:
#     Row3A f1_56[0] · Row3B f1_62[0] · Row3C f1_68[0]
# k Digital assets = Lines2i-l[0].c1_6[2] on-state /11 (MUST be checked for BTC).
