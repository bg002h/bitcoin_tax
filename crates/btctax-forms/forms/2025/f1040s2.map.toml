"form1[0].Page1[0].f1_16[0]" = { line = "5",  rule = "unmodeled", reason = "\"Social security and Medicare tax on unreported tip income. Attach Form 4137\". btctax collects W-2 box 7 (tips already reported to the employer) and REFUSES on box 8 allocated tips (`return_refuse.rs:1208`, RefuseReason::AllocatedTips); it never asks about tips withheld from the employer, and models no Form 4137. ★ The filer-facing question lives on Form 1040 line 1c (tip income not reported on line 1a) — see that form's census. ★ TY2024 named this field Line5_ReadOrder.f1_15 (see the comment above); the wrapper subform is gone and the name is now bare f1_16." }
