"form1[0].Page1[0].Line8_ReadOrder[0].c1_6[0]" = { line = "8 checkbox", rule = "unmodeled", reason = "\"If not required, check here\" — the checkbox presupposes an amount on line 8, which is structurally blank. Checking it would assert a tax-favored-account distribution the filer never reported. ★ TY2024 named this widget Line8_ReadOrder.c1_3 (see the comment above); line 4's three new boxes took c1_3/c1_4/c1_5, so it is now c1_6." }
"form1[0].Page1[0].f1_20[0]" = { line = "9",  rule = "unmodeled", reason = "\"Household employment taxes. Attach Schedule H\" — btctax models no household employees." }
"form1[0].Page1[0].f1_21[0]" = { line = "10", rule = "artifact",  reason = "The form's own text is \"Reserved for future use.\" — TY2025 RETIRED this line; TY2024 printed \"Repayment of first-time homebuyer credit. Attach Form 5405 if required\" in the same position. The IRS still ships a widget for a line that now takes no entry from anyone, so no decision is encodable, by the form's own statement. Same shape as Schedule 3 line 6e, Form 1040 line 30 and Schedule 1 line 22. Line 21 sums \"lines 4, 7 through 16\", so a blank line 10 contributes nothing." }

