"form1[0].Page1[0].f1_18[0]" = { line = "7",  rule = "unmodeled", reason = "\"Total additional social security and Medicare tax. Add lines 5 and 6\" — dead with both blank." }
"form1[0].Page1[0].f1_19[0]" = { line = "8",  rule = "unmodeled", reason = "\"Additional tax on IRAs or other tax-favored accounts. Attach Form 5329 if required\" — btctax models no IRA, HSA, MSA, Coverdell or ABLE account." }
