# Schedule 1 (Additional Income and Adjustments to Income), Form 1040, TY2025.
#
# PORTED from forms/2024/f1040s1.map.toml by `cargo run -p xtask -- port-map f1040s1 2024 2025`, which
# carried 12 of the 14 line cells and 52 of the 55 census entries by (printed label, column band) and
# REFUSED five. Every refusal is resolved below against the form, and every carry is held by
# `port_map::tests::the_tool_agrees_with_every_committed_ty2025_map` once this file is committed.
#
# ⚠️ THE ROOT SUBFORM FLIPPED. TY2024 Schedule 1 roots at `form1[0]`; this revision roots at
#    `topmostSubform[0]`. Every FQN in this file therefore differs from TY2024's in its first segment,
#    and a prefix-rename of the TY2024 map would still be wrong — the widget ORDINALS also shifted
#    (TY2024's `f1_11` is line 7's amount; here that is `f1_12`, and `f1_11` is a new box). This is why
#    the port carries by printed label and not by name.
#
# ⚠️ TWO PAGES — descent is grouped BY PAGE (Part II is entirely on page 2).
#
# Column x-clusters: MID x ≈ [410,482], AMOUNT x ≈ [504,576].
#
# ── WHAT TY2025 CHANGED, measured ────────────────────────────────────────────────────────────────
#
# ★★★ LINE 7 GAINED TWO WIDGETS AND A NEW QUESTION. TY2024 printed "Unemployment compensation" with one
#     amount box. TY2025 prints "Unemployment compensation. If you repaid a 2025 overpayment (see
#     instructions), check here ☐ and enter amount repaid: ____". So line 7 now carries
#     `Line7_ReadOrder[0].c1_3[0]` (a checkbox, on="1") and `Line7_ReadOrder[0].f1_11[0]` (the repaid
#     amount) beside the amount cell. btctax collects neither, so both are censused — and the amount
#     this build writes to line 7 is whatever the filer entered as unemployment compensation, which for
#     a filer who repaid an overpayment is the GROSS. That overstates income, the conservative
#     direction, but it is a collection gap and is filed as one (FOLLOWUPS FR-262).
#
# ★★★ 8z AND 24z EACH LOST A DESCRIPTION CELL TO A MERGE — the same change Schedule A made on line 16.
#     TY2024 gave each write-in TWO description boxes stacked 12pt apart; TY2025 gives ONE box of 24pt.
#       line 8z:  (214.8, 186-198) + (64.8, 174-186)  ->  (64.8, 150-174)   `Line8z_ReadOrder[0].f1_35[0]`
#       line 24z: (234.8, 324-336) + (64.8, 312-324)  ->  (64.8, 276-300)   `Line24z_ReadOrder[0].f2_27[0]`
#     The wider cell's census entry carries onto the merged box; the narrower one has no widget to
#     account for and is DROPPED, which is why this census has 53 entries where TY2024 had 55. The tool
#     refused both rather than choosing, which is the correct behaviour — see
#     `port_map::refuse_collisions`.
#
# ★ The 1099-K reconciliation box did NOT move: `f1_03[0]` sits at (482.4, 660-672) on both revisions
#   and both print the same sentence with the year changed. It refused only because "1099-K" is not a
#   printed LINE label, so there was nothing for the label resolver to match. Resolved by geometry.

form = "f1040s1"
year = 2025
# ── design r2 §4 — the ROW of the year-package table. Values COMPUTED 2026-09-21 (sha256 from the
#    bundled PDF; attachment sequence read off the printed form), never typed by hand. ──
irs_stem            = "f1040s1"
versioning          = "annual"
template_sha256     = "8dafec719f6a4716c259a2bdaca546d9bb9e262d1eabef885fe116a7327458fa"
instructions        = "i1040gi"
line_set            = "f1040s1/2025"
attachment_sequence = "01"

# ── Part I — Additional Income (page 1) ─────────────────────────────────────────────────────────
line1  = "topmostSubform[0].Page1[0].f1_04[0]"   # "Taxable refunds, credits, or offsets of state and local income taxes"  AMOUNT
line3  = "topmostSubform[0].Page1[0].f1_07[0]"   # "Business income or (loss). Attach Schedule C"                          AMOUNT
line7  = "topmostSubform[0].Page1[0].f1_12[0]"   # "Unemployment compensation"                                            AMOUNT
line8f = "topmostSubform[0].Page1[0].f1_18[0]"   # "Income from Form 8889"                                                AMOUNT  ★ T16
line8v = "topmostSubform[0].Page1[0].f1_34[0]"   # "Digital assets received as ordinary income not reported elsewhere"    MID   ★ btctax
line9  = "topmostSubform[0].Page1[0].f1_37[0]"   # "Total other income. Add lines 8a through 8z"                          AMOUNT
line10 = "topmostSubform[0].Page1[0].f1_38[0]"   # "Combine lines 1 through 7 and 9…" → 1040 line 8                       AMOUNT

# ── Part II — Adjustments to Income (page 2) ────────────────────────────────────────────────────
line13 = "topmostSubform[0].Page2[0].f2_03[0]"   # "Health savings account deduction. Attach Form 8889"                   AMOUNT  ★ T16
line15 = "topmostSubform[0].Page2[0].f2_05[0]"   # "Deductible part of self-employment tax. Attach Schedule SE"           AMOUNT
line18 = "topmostSubform[0].Page2[0].f2_08[0]"   # "Penalty on early withdrawal of savings"                               AMOUNT
line21 = "topmostSubform[0].Page2[0].f2_13[0]"   # "Student loan interest deduction"                                      AMOUNT
line26 = "topmostSubform[0].Page2[0].f2_30[0]"   # "Add lines 11 through 23 and 25…" → 1040 line 10                       AMOUNT

# ── Page-1 identity block ───────────────────────────────────────────────────────────────────────
# ★ REFUSED by the port (no printed line label) and resolved here by geometry: both widgets sit at
#   y=684-698 on page 1 with byte-identical rects to TY2024's, and the SSN box carries /MaxLen 11 —
#   the hyphenated spelling every schedule in this crate uses.
[identity]
name = "topmostSubform[0].Page1[0].f1_01[0]"
ssn  = "topmostSubform[0].Page1[0].f1_02[0]"

# ★★★ R2.2 — THE `[direction]` TABLE. Each block's `caption` is asserted VERBATIM against
#     design/forms/extract/f1040s1--2025.txt at `extract_line` BEFORE the join uses it, so this table
#     is a READING of the form and a re-parted revision REDS rather than drifting. The part captions
#     and their line ranges are unchanged from TY2024; only the 1099-K sentence's year and the Part II
#     extract line moved (62 -> 64).
[[direction]]
caption      = "For 2025, enter the amount reported to you on Form(s) 1099-K"
extract_line = 15

[[direction]]
caption      = "Part I       Additional Income"
extract_line = 19
first_line   = "1"
last_line    = "10"

[[direction]]
caption      = "Part II     Adjustments to Income"
extract_line = 64
first_line   = "11"
last_line    = "26"

[census]

# ── The unnumbered 1099-K reconciliation line, above Part I ──────────────────────────────────────
# ── THE FIVE CHECKBOXES AND ONE WRITE-IN THIS REVISION ADDED ─────────────────────────────────────
# TY2024 Schedule 1 declares ZERO buttons (measured: `dump-fields | grep -c btn` = 0). TY2025 declares
# five, plus one write-in amount, and each attaches a NEW question to a line that already existed. None
# was carried by the port because none has a TY2024 counterpart to carry — they are read off the form
# here, with the sentence each one belongs to quoted from design/forms/extract/f1040s1--2025.txt.
#
# ★★★ Each is censused rather than mapped, and for a reason that differs per line. A checkbox is
#     TESTIMONY: checking line 20's says "I am married filing separately and lived apart from my spouse
#     for the entire year" in support of an IRA deduction this build does not compute. Writing it beside
#     a blank line 20 would assert a fact in aid of a claim nobody made.
"topmostSubform[0].Page1[0].c1_1[0]" = { line = "4 Form 4797", rule = "unmodeled", names = "Form 4797", reason = "Form 4797 — \"Other gains or (losses). Check if any from Form(s): 4797\". TY2024 printed \"Attach Form 4797\" with no box. Line 4 itself is unmodelled (no \u00a71231 property), so the box saying which form the figure came from has no figure to qualify.", covered_by = "QuestionId::OtherOutOfScopeIncome" }
"topmostSubform[0].Page1[0].c1_2[0]" = { line = "4 Form 4684", rule = "unmodeled", names = "Form 4684", reason = "Form 4684 — the casualty-and-theft half of the same line-4 pair, NEW on this revision; TY2024 named only Form 4797. Same reason: line 4 is unmodelled.", covered_by = "QuestionId::OtherOutOfScopeIncome" }
"topmostSubform[0].Page1[0].Line7_ReadOrder[0].c1_3[0]" = { line = "7 repaid", rule = "gap", reason = "\"If you repaid a 2025 overpayment (see instructions), check here\" — NEW on this revision, and a declaration btctax never asks. Line 7 IS modelled, so this is not an out-of-scope situation: it is a required disclosure about an in-scope line. A filer who repaid an overpayment files a line 7 that is the GROSS with the box unchecked, and nothing says so. Direction is conservative (income overstated), but the value on a sworn line is still wrong. FOLLOWUPS FR-262." }
"topmostSubform[0].Page1[0].Line7_ReadOrder[0].f1_11[0]" = { line = "7 amount repaid", rule = "gap", reason = "\"and enter amount repaid:\" — the write-in beside the checkbox above, and the second half of the same never-asked declaration. A value here without the checkbox, or either without a collected repayment, would be invented testimony. FOLLOWUPS FR-262." }
"topmostSubform[0].Page2[0].c2_1[0]" = { line = "14 storage fees", rule = "unmodeled", reason = "\"If claiming only storage fees (see instructions), check here\" — NEW on this revision. Line 14 (moving expenses for members of the Armed Forces, Form 3903) is unmodelled, so there is no claim for this box to narrow.", covered_by = "Advisory::UnmodeledDeductionsOmitted" }
"topmostSubform[0].Page2[0].c2_2[0]" = { line = "20 MFS lived apart", rule = "unmodeled", reason = "\"If you are married filing separately and lived apart from your spouse for the entire year (see instructions), check here\" — NEW on this revision. btctax DOES know this fact: `AbsoluteReturn::mfs_lived_apart_disclosure` computes it for the \u00a786 Social Security worksheet. It stays blank anyway, because line 20 is the IRA deduction and this build models no IRA — the box is testimony in support of a deduction that is not being claimed.", covered_by = "Advisory::UnmodeledDeductionsOmitted" }

"topmostSubform[0].Page1[0].f1_03[0]" = { line = "1099-K", rule = "unmodeled", reason = "Amount from Form(s) 1099-K included in error or for personal items sold at a loss — btctax collects no 1099-K. Informational: it feeds no sum, and it reduces rather than adds.", covered_by = "RefuseReason::DocumentTypeUnsupported", part = "For 2025, enter the amount reported to you on Form(s) 1099-K" }

"topmostSubform[0].Page1[0].f1_05[0]" = { line = "2a", rule = "unmodeled", reason = "Alimony received — btctax models no alimony.", covered_by = "QuestionId::OtherOutOfScopeIncome", names = "Alimony received" }
"topmostSubform[0].Page1[0].f1_06[0]" = { line = "2b", rule = "unmodeled", reason = "Date of the original divorce or separation agreement — dead with line 2a blank (the date only matters to decide pre/post-TCJA treatment of an amount).", covered_by = "QuestionId::OtherOutOfScopeIncome", names = "divorce or separation agreement" }
