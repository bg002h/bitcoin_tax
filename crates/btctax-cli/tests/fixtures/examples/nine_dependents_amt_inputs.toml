# §163(h)(3)(B) — this filer is inside every i1040sca acquisition-debt ceiling, so Schedule A line 8a
# keeps the whole $18,000. ★ DELETING THIS LINE ALSO REFUSES THE RETURN (MortgageDebtLimitUnanswered).
mortgage_within_debt_limit = true
